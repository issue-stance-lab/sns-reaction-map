  - id: note-taxcut-series-planning
    department: editorial
    status: completed
    current_state: "第1回「消費税減税『賛成6割』の中身は、政策への支持ではなかった」は2026-09-21 13:38にnote公開済み（approval-20260921-002、posts.md参照）。同日、第2回（対象範囲と財源）の下書きをconsumption-tax-cut-note2-FINAL.mdとして作成しmainへ反映済み（task/note-taxcut-2）。SNSデータはJSONから数え直し済み（意見3,890件、うち減税の対象範囲885件・財源と社会保障511件、2026-09-17まで収集分。第1回作成時点の3,358件から増分）。主張は「大綱は対象範囲には答えを出したが財源にはまだ答えを出していない」。内訳比較図（consumption-tax-cut2_fig1-scope-funding.png）は作成済み。見出し画像は背景写真が未着手（本文中に依頼用GPTimage2プロンプト記載済み）。オーナーへは①〜④の骨子（本文冒頭コメント）の確認を依頼中——財源・政党比較を扱う回のためSERIES-BRIEF7節4番の推奨に沿い、本文をnote下書き画面へ反映する前に方向性を確認する。第3〜4回は未着手。【2026-10-03】第3回（SNSの賛否：効果をめぐる食い違い）の下書きをconsumption-tax-cut-note3-FINAL.mdとして作成（task/taxcut-note3）。SNSデータは、10/3公開の更新分（〜10/2収集）までを含む意見4,823件で数え直した（第1回3,358件、第2回3,890件から増分。初稿は〜9/24の4,340件で書き、更新の公開後に差し替えた）。首相の発言（10/1報道、引き下げ分は基本的に価格に反映される）も大綱の節に加えた。主張は「消費税減税の効果は、減税の前後の値札で見るか、減税がなかった場合と比べるかで答えが変わる。この比べ方の違いは、SNSで効果をめぐる議論がかみ合いにくい一因」（効果を疑う投稿の3割近くが前後の値札型、民間エコノミストの予測は反事実型）。図1・図2と、数字と図を再現するスクリプト（content/note/drafts/figures/consumption-tax-cut3_build.py）を作成。一次資料メモに資料Q（日本経済研究センターESPフォーキャスト調査2026年9月）と大綱本文の語句確認を追記。よみやす検査（--strict）とAI臭検査を通過。別エージェントによる独立確認を4回実施（1回目は needs_revision で全面改稿、3回目は ready_for_ceo、更新データと首相発言を足した後の4回目の軽微な指摘4点とnit6点まで反映済み）。結果は quality/reviews/2026-10-03-note-taxcut-3.md に記録。公開文章をよみやす基準で最初から書いた最初のnote記事。見出し画像の背景写真は未着手（依頼プロンプトは下書き内）。想定読者の1文はオーナー確認待ち。 【2026-10-07】第2回は2026-09-29 22:43、第3回は2026-10-04 13:47にnote公開済み（posts.mdに記録。第3回の公開版は更新前の数字（意見4,340件）の版で、最終版（4,823件・首相発言の段落入り）ではない。末尾で次回は就業者負担軽減支援金を読むと予告している）。第4回（最終回）の下書きをconsumption-tax-cut-note4-FINAL.mdとして作成（task/taxcut-note4）。オーナーの依頼（消費税減税ページに加わった「意見の推移」のデータを使った回）により、題材を支援金から推移に変えた（大綱のあとの意見1,465件のうち支援金に触れたのは10件ほどで、声と照らして読む材料が足りない）。主張は「SNSの賛成の割合は大綱のあとに5割弱から4割に下がったが、同じころの世論調査（日経・テレ東、7月48%→9月53%）では下がっておらず、世論の変化とは読めない。SNSの中で下がったのは財源・公約・効果の話題で、対象範囲では下がっていない」。数字と図2を再現するスクリプト（content/note/drafts/figures/consumption-tax-cut4_build.py）、図1（サイトの推移グラフのひと目版を書き換えずに使用）、見出し画像の合成用HTML/描画スクリプトを作成。よみやす検査（--strict）・noslop・AI臭検査を通過。独立確認の1回目は needs_revision（blocker 1件：初稿の根拠の件数が検索の上限で割合の言い直しになる）で、件数を根拠から外して組み替え