<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <title>論点別に見た移行支持の割合</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --page: #07111E;
      --card-1: #0C1E35;
      --card-2: #0A1928;
      --card-3: #071522;
      --ink: #F0F4FF;
      --ink-70: rgba(240,244,255,0.70);
      --ink-45: rgba(240,244,255,0.45);
      --teal: #2DD4BF;
      --red: #F87171;
      --amber: #FBBF24;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 660px; overflow: hidden; }
    body {
      background: var(--page);
      color: var(--ink);
      font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif;
      font-variant-numeric: tabular-nums;
    }
    .canvas {
      position: relative;
      width: 1200px;
      height: 660px;
      padding: 36px 52px 28px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      background: linear-gradient(145deg, var(--card-1) 0%, var(--card-2) 60%, var(--card-3) 100%);
    }
    .canvas::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }
    .content { position: relative; z-index: 1; }
    h1 {
      margin: 0;
      color: var(--ink);
      font-size: 28px;
      font-weight: 700;
      letter-spacing: .01em;
      line-height: 1.4;
    }
    .lead {
      margin: 10px 0 0;
      color: var(--ink-70);
      font-size: 20px;
      font-weight: 400;
      line-height: 1.5;
    }
    .chart {
      position: relative;
      width: 1096px;
      height: 480px;
      margin-top: 24px;
    }
    .gridline {
      position: absolute;
      top: 0;
      bottom: 44px;
      width: 1px;
      background: rgba(255,255,255,0.06);
    }
    .gridline.zero { left: 250px; }
    .gridline.twenty { left: 450px; }
    .gridline.forty { left: 650px; }
    .gridline.sixty { left: 850px; }
    .row {
      position: absolute;
      left: 0;
      display: flex;
      align-items: center;
      width: 950px;
      height: 72px;
    }
    .row-1 { top: 0; }
    .row-2 { top: 88px; }
    .row-3 { top: 176px; }
    .row-4 { top: 264px; }
    .row-5 { top: 352px; }
    .label {
      width: 250px;
      padding-right: 18px;
      color: var(--ink);
      font-size: 20px;
      font-weight: 500;
      line-height: 1.35;
    }
    .label small {
      display: block;
      margin-top: 4px;
      color: var(--ink-45);
      font-size: 18px;
      font-weight: 400;
      line-height: 1.2;
    }
    .bar-area {
      position: relative;
      width: 600px;
      height: 48px;
    }
    .bar {
      height: 48px;
      border-radius: 0 4px 4px 0;
      background: var(--teal);
    }
    .bar-1 { width: 599px; background: var(--teal); }
    .bar-2 { width: 450px; background: rgba(45,212,191,0.78); }
    .bar-3 { width: 417px; background: rgba(45,212,191,0.72); }
    .bar-4 { width: 300px; background: rgba(45,212,191,0.52); }
    .bar-5 { width: 167px; background: rgba(45,212,191,0.30); }
    .value {
      width: 100px;
      margin-left: 18px;
      color: var(--ink-70);
      font-size: 26px;
      font-weight: 900;
      line-height: 1;
      white-space: nowrap;
    }
    .row-1 .value { color: var(--teal); }
    .row-5 .value { color: var(--red); }
    .bracket {
      position: absolute;
      top: 31px;
      left: 1010px;
      width: 2px;
      height: 353px;
      background: var(--amber);
    }
    .bracket::before,
    .bracket::after {
      content: '';
      position: absolute;
      left: -9px;
      width: 20px;
      height: 2px;
      background: var(--amber);
    }
    .bracket::before { top: 0; }
    .bracket::after { bottom: 0; }
    .callout {
      position: absolute;
      top: 130px;
      left: 1030px;
      width: 118px;
    }
    .multiple {
      color: var(--amber);
      font-size: 34px;
      font-weight: 900;
      line-height: 1.15;
      white-space: nowrap;
    }
    .explain {
      margin-top: 8px;
      color: var(--ink-70);
      font-size: 18px;
      font-weight: 400;
      line-height: 1.45;
    }
    .axis {
      position: absolute;
      left: 250px;
      top: 454px;
      display: flex;
      justify-content: space-between;
      width: 600px;
      color: var(--ink-45);
      font-size: 16px;
      line-height: 1;
    }
    .note {
      position: absolute;
      right: 52px;
      bottom: 8px;
      left: 52px;
      color: var(--ink-45);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <main class="canvas" aria-label="論点別に見た移行支持の割合">
    <div class="content">
      <h1>論点別に見た「移行支持」の割合</h1>
      <p class="lead">母集団はすべて同じ754件。分け方を変えただけです</p>
      <section class="chart" aria-label="論点別の移行支持率">
        <div class="gridline zero"></div>
        <div class="gridline twenty"></div>
        <div class="gridline forty"></div>
        <div class="gridline sixty"></div>

        <div class="row row-1">
          <div class="label">教員の働き方<small>227件</small></div>
          <div class="bar-area"><div class="bar bar-1"></div></div>
          <div class="value">59.9%</div>
        </div>
        <div class="row row-2">
          <div class="label">制度・移行プロセス<small>171件</small></div>
          <div class="bar-area"><div class="bar bar-2"></div></div>
          <div class="value">45.0%</div>
        </div>
        <div class="row row-3">
          <div class="label">教育的意義・機会<small>144件</small></div>
          <div class="bar-area"><div class="bar bar-3"></div></div>
          <div class="value">41.7%</div>
        </div>
        <div class="row row-4">
          <div class="label">受け皿・指導者<small>100件</small></div>
          <div class="bar-area"><div class="bar bar-4"></div></div>
          <div class="value">30.0%</div>
        </div>
        <div class="row row-5">
          <div class="label">費用・家庭負担<small>72件</small></div>
          <div class="bar-area"><div class="bar bar-5"></div></div>
          <div class="value">16.7%</div>
        </div>

        <div class="bracket" aria-hidden="true"></div>
        <div class="callout">
          <div class="multiple">3.6倍</div>
          <div class="explain">同じ754件の<br>中での開き</div>
        </div>
        <div class="axis" aria-hidden="true"><span>0%</span><span>20%</span><span>40%</span><span>60%</span></div>
      </section>
    </div>
    <p class="note">※このほか「その他」35件、「地域格差」5件があります</p>
  </main>
</body>
</html>
