<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <title>SNS公開投稿 754件の立場</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --page: #07111E;
      --card-1: #0C1E35;
      --card-2: #0A1928;
      --card-3: #071522;
      --ink: #F0F4FF;
      --ink-70: rgba(240,244,255,0.70);
      --teal: #2DD4BF;
      --red: #F87171;
      --amber: #FBBF24;
      --gray: #64748B;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 300px; overflow: hidden; }
    body {
      background: var(--page);
      color: var(--ink);
      font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif;
      font-variant-numeric: tabular-nums;
    }
    .canvas {
      position: relative;
      width: 1200px;
      height: 300px;
      padding: 32px 52px 28px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      background: linear-gradient(145deg, var(--card-1) 0%, var(--card-2) 60%, var(--card-3) 100%);
    }
    .canvas::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }
    .content { position: relative; z-index: 1; }
    h1 {
      margin: 0;
      color: var(--ink);
      font-size: 28px;
      font-weight: 700;
      letter-spacing: .01em;
      line-height: 1.4;
    }
    .bar {
      display: flex;
      gap: 2px;
      height: 72px;
      margin-top: 28px;
      overflow: hidden;
      border-radius: 8px;
      background: rgba(7,17,30,0.72);
    }
    .segment {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      color: #07111E;
      font-size: 24px;
      font-weight: 700;
      line-height: 1;
    }
    .support { flex: 44 1 0; background: var(--teal); }
    .cautious { flex: 32.2 1 0; background: var(--red); }
    .conditional { flex: 19 1 0; background: var(--amber); }
    .neutral { flex: 4.8 1 0; background: var(--gray); }
    .legend {
      display: flex;
      align-items: center;
      gap: 22px;
      margin-top: 26px;
      color: var(--ink-70);
      font-size: 19px;
      line-height: 1.35;
      white-space: nowrap;
    }
    .legend-item { display: flex; align-items: center; gap: 9px; }
    .dot { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }
    .dot.support { background: var(--teal); }
    .dot.cautious { background: var(--red); }
    .dot.conditional { background: var(--amber); }
    .dot.neutral { background: var(--gray); }
    .count { color: var(--ink); font-weight: 700; }
  </style>
</head>
<body>
  <main class="canvas" aria-label="SNS公開投稿754件の立場の内訳">
    <div class="content">
      <h1>SNS公開投稿 754件の立場</h1>
      <div class="bar" role="img" aria-label="移行支持44.0パーセント、慎重・反対32.2パーセント、条件付き・改善要求19.0パーセント、中立・情報4.8パーセント">
        <div class="segment support">44.0%</div>
        <div class="segment cautious">32.2%</div>
        <div class="segment conditional">19.0%</div>
        <div class="segment neutral" aria-label="中立・情報4.8パーセント"></div>
      </div>
      <div class="legend" aria-label="凡例">
        <div class="legend-item"><span class="dot support"></span><span>移行支持</span><span class="count">332件</span></div>
        <div class="legend-item"><span class="dot cautious"></span><span>慎重・反対</span><span class="count">243件</span></div>
        <div class="legend-item"><span class="dot conditional"></span><span>条件付き・改善要求</span><span class="count">143件</span></div>
        <div class="legend-item"><span class="dot neutral"></span><span>中立・情報</span><span class="count">36件（4.8%）</span></div>
      </div>
    </div>
  </main>
</body>
</html>
