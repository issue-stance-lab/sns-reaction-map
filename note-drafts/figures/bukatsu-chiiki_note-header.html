<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1">
  <title>部活動の地域移行</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --page: #07111E;
      --card-1: #0C1E35;
      --card-2: #0A1928;
      --card-3: #071522;
      --ink: #F0F4FF;
      --ink-70: rgba(240,244,255,0.70);
      --ink-45: rgba(240,244,255,0.45);
      --teal: #2DD4BF;
      --red: #F87171;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1280px; height: 670px; overflow: hidden; }
    body {
      background: var(--page);
      color: var(--ink);
      font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif;
      font-variant-numeric: tabular-nums;
    }

    .canvas {
      position: relative;
      width: 1280px;
      height: 670px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      background: var(--page);
    }

    .photo,
    .gradient,
    .shade {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .photo {
      object-fit: cover;
      object-position: center center;
      transform: scale(1.10);
      transform-origin: left center;
    }

    .gradient {
      background: linear-gradient(
        90deg,
        rgba(7,17,30,0.94) 0%,
        rgba(7,17,30,0.86) 42%,
        rgba(7,17,30,0.15) 72%,
        rgba(7,17,30,0) 100%
      );
    }

    .shade {
      background: rgba(7,17,30,0.25);
    }

    .canvas::before {
      content: '';
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255,255,255,0.08);
      pointer-events: none;
    }

    .content {
      position: absolute;
      z-index: 2;
      top: 176px;
      left: 310px;
      width: 650px;
      text-align: left;
    }

    .eyebrow {
      margin: 0 0 24px;
      color: var(--ink-70);
      font-size: 26px;
      font-weight: 500;
      letter-spacing: .08em;
      line-height: 1.35;
      white-space: nowrap;
    }

    .change {
      position: relative;
      display: flex;
      align-items: baseline;
      gap: 4px;
      white-space: nowrap;
      line-height: .98;
      letter-spacing: -.02em;
    }

    .number {
      position: relative;
      z-index: 1;
      font-size: 100px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }
    .before { color: var(--teal); }
    .after { color: var(--red); }
    .arrow {
      position: relative;
      z-index: 1;
      color: var(--ink-45);
      font-size: 54px;
      font-weight: 400;
      letter-spacing: -.08em;
    }

    .subtitle {
      margin: 26px 0 0;
      color: var(--ink-45);
      font-size: 20px;
      font-weight: 400;
      letter-spacing: .01em;
      line-height: 1.4;
      white-space: nowrap;
    }

    .credit {
      position: absolute;
      z-index: 2;
      right: 28px;
      bottom: 20px;
      color: rgba(240,244,255,0.55);
      font-size: 12px;
      letter-spacing: .08em;
      line-height: 1;
    }
  </style>
</head>
<body>
  <main class="canvas" aria-label="部活動の地域移行に関する見出し画像">
    <img class="photo" src="../photos/teacher-gym.png" alt="体育館の入口に立つ学校教員">
    <div class="gradient" aria-hidden="true"></div>
    <div class="shade" aria-hidden="true"></div>
    <div class="content">
      <p class="eyebrow">部活動の地域移行</p>
      <div class="change" aria-label="44パーセントから17パーセントへ">
        <span class="number before">44%</span>
        <span class="arrow" aria-hidden="true">→</span>
        <span class="number after">17%</span>
      </div>
      <p class="subtitle">SNS公開投稿 754件を論点別に分析</p>
    </div>
    <div class="credit">SNS反応まっぷ</div>
  </main>
</body>
</html>
