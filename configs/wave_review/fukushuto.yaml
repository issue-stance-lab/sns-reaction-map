title: 副首都構想（大阪・副首都法案）の賛否
opinion_guide: 投稿者自身の、副首都構想・副首都法案（候補地、防災、都構想・維新との関係、費用、定義、優先順位）についての評価・感情・主張が本文から読めるなら true。
issue_guide: 候補地／都構想・維新／防災・災害／定義・中身／優先順位／費用・財源／その他。政党・政治家の評価が中心の投稿は、既存の正典に合わせて「都構想・維新」に置く。
stance_guide: 法案賛成・推進／法案反対／中立・情報（意見だが賛否が読めない、または意見でない）。
new_issue_examples: 「東京の既得権の再配分」「首都機能の分散先」
notes: |
  生成器は候補を母数に山なみを作る（build_fukushuto_arena.py --input）。資料にしかない話の match_rule.machine_hits は正典への正規表現の再実行と一致が必要。
  主張の該当投稿 data/fukushuto_claim_posts.json と CHECKED_AT（build_fukushuto_process_sections.py）を今回分で更新。
