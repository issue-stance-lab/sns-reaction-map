title: 部活動の地域移行（公立中学校の休日の部活動を地域クラブへ移す改革）
opinion_guide: 投稿者自身の、部活動の地域移行・地域展開（休日の部活動を学校から地域のクラブや外部指導者へ移すこと、教員の負担、費用、受け皿、部活動のあり方）についての評価・感情・主張・体験に基づく意見が本文から読めるなら true。ニュースの見出しやURL共有だけ、告知や募集だけ、プロ野球・高校野球・大会結果などの部活動の試合や成績の話、芸能人・漫画の話、地域移行に触れない学校行事の話は意見外。自分や子どもの部活動の実際の経験を書き、そこから地域移行の良し悪しが読めるなら意見。
issue_guide: 教員の働き方＝顧問の教員の負担・残業・給特法・ただ働き・外部の指導者に任せたい・部活動ごとの廃止／制度・移行プロセス＝国や自治体の計画・ガイドライン・日程・進め方・決まっていない条件・進まない責任の所在／教育的意義・機会＝子どもの居場所・入口・活動の選択肢・部活動に教育上の意味があるか／受け皿・指導者＝地域クラブや指導者が足りるか・報酬・責任と安全・認定制度／費用・家庭負担＝会費・月謝・交通費・誰が払うか・家計や経済格差で参加に差が出ること／地域格差＝住む地域や自治体によって受け皿・費用・進み具合に差が出ること／その他＝上記以外（保険・安全管理、少子化と学校統廃合、個別の学校の話、コンクールや大会の扱いなど）。
stance_guide: 移行支持＝地域移行・地域展開を進めるべき、教員の負担軽減として賛成と書く／慎重・反対＝地域移行に反対・疑問、いまのままの学校部活動がよい、移しても改善しないと書く／条件付き・改善要求＝進めること自体は否定しないが、費用負担・指導者・制度を整えるべき、進め方に問題があると条件や改善を求める／中立・情報＝経験談や状況の説明が中心で、地域移行への賛否や要求までは読み取れない（皮肉で真意が取れない場合もここ）。部活動の話題でも、地域移行そのものへの評価が書かれていなければ中立・情報。
neutral_stance: 中立・情報
new_issue_examples: 「安全管理・事故」「少子化・学校統廃合」「大会・コンクールの扱い」
notes: |
  理由区分のある5論点（教員の働き方・制度・移行プロセス・教育的意義・機会・受け皿・指導者・費用・家庭負担）は、再読データ3ファイルに分かれている
  （configs/planet/bukatsu-chiiki.yaml の sub_issues）。どの区分にも当てはまらない投稿は、除外用の区分に入れる
  （configs/bukatsu-chiiki-reading.json の excluded_buckets：教員の働き方=F,N／制度・移行プロセス=other／教育的意義・機会=other／受け皿・指導者=R6／費用・家庭負担=P6）。
  「地域格差」と「その他」には理由区分が無い（読書面は「理由は未公開」）。
  新しい意見が明細に無いと refresh_adapters/bukatsu.py の build_reread_stances が「追い読みが要ります」で止まる。
  件数の上位4件の理由が入れ替わったら configs/bukatsu-chiiki-reading.json の issues.{論点ID}.reasons に voice と reasons_read を足す（DATA_REFRESH.md）。
  立場の対応表 data/bukatsu-chiiki_reread-stances.json は更新経路が作り直すので手で作らない。
  主張の該当投稿 data/bukatsu-chiiki_claim_posts.json、資料にしかない話の母数 data/verification/bukatsu-chiiki-sunk-continents.json の sns_base も更新が要る。
  同文の連投（署名運動の定型文など）は1件1意見で数え、監査に明記する。
  課題99（2026-10-31棚卸し）: 主張照合が30日以上遅れている。次回更新では quality/reviews/2026-10-31-claim-coverage-plan.json の対象と既存主張を必ず確認する。
  新規投稿の分類確認だけでは完了にしない。既存対象と今回の追加・修正意見を主張ごとに本文で照合し、追加・不採用・判断理由をIDと本文の指紋で記録する。
  一次資料の再取得と投稿の照合範囲は別々に記録する。完了した範囲だけ確認日を進め、claim_posts・検証写し・公開JSONの件数を揃える。
  公開前監査に、照合した範囲・未確認の件数・一次資料の変化・今回の照合記録の場所を明記する。未確認が残る間は照合完了としない。
