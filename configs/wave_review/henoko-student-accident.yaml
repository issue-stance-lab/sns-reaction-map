title: 辺野古高校生死亡事故
opinion_guide: 投稿者自身の、辺野古での修学旅行中の高校生死亡事故、文科省の教育基本法違反の認定、平和教育・学校の安全管理、追悼や報道・行政の対応についての評価・主張・懸念・追悼の意思が本文から読めるなら true。ニュース見出しの転載やURL共有だけ、他人の発言の引用だけ、事故に触れない辺野古の基地一般の話、2024年のダンプカー・警備員の事故（別件）の話は意見外。引用を添えていても、投稿者自身の評価が一言でも書かれていれば意見。
issue_guide: 政治的中立性＝学校教育と政治活動・抗議活動の境界、教育基本法の中立、教組や団体と学校の関係／安全管理・事故原因＝引率・船の選定と運航・契約・責任の所在・調査と説明・再発防止／追悼・被害者の尊厳＝犠牲者や遺族への配慮、追悼や謝罪の時期・場所・対応、慰霊の場の使い方／平和教育の萎縮＝国の介入が教育を萎縮させるか、学ぶ機会と生徒の自主性、教育の自由／政治利用・基地問題＝事故を選挙や基地反対運動へ結びつけること、批判する側の説明責任、基地政策の是非／報道・行政対応＝報道の量や取り上げ方、行政・政党の説明と調査、会見や記録への受け止め／その他＝上記以外（SNS上の反応への感想など）。投稿の主張の中心で1つに決める。追悼式のヤジなど政治的演出への批判は、遺族への配慮が中心なら「追悼・被害者の尊厳」、運動への批判が中心なら「政治利用・基地問題」。
stance_guide: 文科省判断を支持＝文科省の認定（教育基本法違反）を妥当・当然だと書く／文科省判断に反発＝文科省の認定を不当・行きすぎ・教育への圧力だと書く／論点を切り分ける＝文科省判断への賛否は書かず、事故の安全管理や学校責任、報道、追悼など別の問題を語る意見（安全管理や学校責任を批判していても、文科省判断を明示して評価していなければここ）／中立・情報共有＝ニュースの共有、事実確認、立場の読み取れない短い投稿。「抗議声明を批判する」は文科省判断への反発ではない。二重否定・皮肉は批判の対象を読んで決める。
neutral_stance: 中立・情報共有
new_issue_examples: 「船会社・運航の責任」「遺族への補償」「修学旅行制度の見直し」
notes: |
  専用再読ファイル data/henoko-student-accident_issues-reread.json は平坦な items（post_key 形式、main_issue 付き）＋ buckets[論点]（6論点すべて）。
  新デザイン（henoko_layout）は再読データの items 件数と公開JSONの意見数・立場の対応表を照合する。明細が足りないと
  refresh_adapters/henoko.py の build_reread_stances が「追い読みが要ります」で止まり、全テーマの候補生成が止まる。
  立場の対応表 data/henoko-student-accident_reread-stances.json は更新経路が作り直すので手で作らない。
  遺族・氏名・学校名・船名は公開文章（理由区分の表示名・sns_note・要約）に書かない。
  「論点を切り分ける」は大半を占める（過去の回で意見の約9割）。賛否が書かれていない意見はここに入れる。
  語られていない争点の母数は data/verification/henoko-student-accident-sunk-continents.json（sns_base は今回の意見数）。
  同文の連投は1件1意見で数え、監査に明記する。
