title: 高齢者の運転免許を年齢で一律に返納させるべきか（免許返納の義務化）
opinion_guide: 投稿者自身の、高齢者の免許返納（義務化・返納支援・適性検査・地方の移動手段など）についての評価・感情・主張が本文から読めるなら true。「免許返納しろ」を危険な運転者への罵倒として使うだけの投稿、芸能人など高齢者以外の返納の話、自治体や企業の特典の告知は意見外。
issue_guide: 義務化・事故防止＝年齢での一律返納や事故防止の是非／地方の足・移動権＝車がないと生活できない地域の問題／適性検査強化＝認知機能検査・実技検査の強化など年齢でなく能力で判断／代替交通整備＝バス・デマンド交通・自動運転などの整備／自主返納支援＝返納の特典・支援・手続き／その他＝上記に当てはまらないが免許返納に関する意見。
stance_guide: 義務化賛成＝年齢による一律返納・義務化に賛成／条件付き賛成＝検査や代替手段などの条件付きで返納を進める立場／義務化反対＝一律の義務化に反対（地方の足、年齢差別など）／中立・情報＝意見だが賛否が読めない、または意見でない。
new_issue_examples: 「家族の説得」「高齢運転者の識別表示」「保険・補償」
notes: |
  理由区分があるのは「義務化・事故防止」「地方の足・移動権」の2論点だけ。再読共通台帳あり（register が要る）。
  事実確認の主張（更新・地方の足・特典など7つ）は data/elderly-license-revocation_claim_posts.json に手で足し、
  build_elderly_process_sections.py --input 候補 --verification-dest data/verification で写しを作り直す。
  制度の確認日（configs/elderly-license-revocation-opening.json の checked_on）は主張の照合日以上が必要。
