title: 消費税減税（食料品減税・給付との比較）の賛否
opinion_guide: 投稿者自身の、消費税減税（是非・対象範囲・効果・財源・給付など他策との比較・事業者負担・公約と政治不信）についての評価・感情・主張が本文から読めるなら true。
issue_guide: 公約と政治不信／給付など他策との比較／財源と社会保障／減税の対象範囲／減税の効果／事業者の実務負担／その他。
stance_guide: 減税推進／条件付き賛成・政府案に不満（一律・恒久化を求めるなど）／減税反対・慎重／中立・情報（意見だが賛否が読めない、または意見でない）。
new_issue_examples: 「社会保険料の負担軽減」「減税以外の物価対策」
notes: |
  理由区分があるのは4論点（対象範囲・効果・給付比較・事業者負担）。専用ファイルは論点ごとの節に items/excluded_items を持つ入れ子形式。
  apply 後に落ちる期待値テスト: test_consumption_tax_connected / test_consumption_tax_connected_refresh / test_consumption_tax_search_entry / test_trend_provenance。
