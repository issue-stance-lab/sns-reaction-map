title: 皇室典範改正（2026年7月成立、10月24日施行。女性皇族の婚姻後の皇籍維持と、旧宮家の男系男子の養子縁組）
opinion_guide: 投稿者自身の、皇室典範改正・皇位継承のあり方（男系か女系か、女性天皇・女系天皇、旧宮家養子、愛子さまなど皇族の地位、国会の審議・採決、報道や議論のしかた）についての評価・感情・主張が本文から読めるなら true。ニュースの見出しやURL共有だけ、皇室行事の感想だけ、海外王室の話、皇室典範に触れない政治一般の話は意見外。
issue_guide: 男系vs女系＝継ぐ資格を男系男子に限るか女系へ広げるかという考え方そのもの／女性天皇・女系天皇＝女性天皇・女系天皇の容認や是非、世論調査との差／旧宮家養子縁組＝旧宮家の男系男子を養子に迎える制度の是非・条件・実現性／愛子さま・皇族の地位＝愛子さまや女性皇族の婚姻後の身分・家族の扱い・特定皇族の地位／立法手続き・民主主義＝国会の審議・採決・政党の対応・拙速批判・民意と国会の差／その他＝上記以外（財政・税の使い道、報道、他の法案と並べた批判、皇室制度の存廃など）。
stance_guide: 立場は「今回の改正案（女性皇族の皇籍維持＋旧宮家養子の2本立て）全体」への評価だけで決める。今回案全体を支持＝この改正の内容で十分・良いとする／今回案全体に反対＝この改正の内容や進め方に問題があり認められないとする／全体評価は条件付き＝方向性は理解できるが今のままでは足りないとする／今回案全体は未表明＝意見はあるが今回案全体への賛否までは書いていない（女性天皇への希望、男系維持の主張、養子の条件への疑問、政治家の採決行動や報道への批判だけなら、ここ）／全体評価を読み取れない＝今回案への評価を書いているらしいが方向を判断できない。**女性天皇容認＝反対、男系維持＝支持、のように個別論点の立場から全体賛否を作らない。** 多くの投稿は未表明になる。
neutral_stance: 今回案全体は未表明
new_issue_examples: 「皇室制度の存廃」「皇族の人権・自由」「宮内庁・内閣の説明責任」
notes: |
  6論点すべてに理由区分あり。専用ファイル data/koshitsu-tenpakai_issues-reread.json は平坦な items（post_key 形式）で、
  items の件数が公開JSONの意見数と一致しないと新デザイン（koshitsu_layout）の生成が止まる＝全テーマの候補生成が止まる。
  再読共通台帳あり。apply のあと、候補生成（--prepare-promotion）の前に register を回す（専用ファイルの指紋も register が合わせる。
  register 前に候補生成すると「再読台帳の出所が変更されています」で止まる）。
  data/verification/koshitsu-tenpakai-issues-reread.json（items の写し）は候補生成が作り直す。
  CHECKED_AT（主張の照合日）を進めたら、同じ日付の節を quality/research/koshitsu-tenpakai-primary-sources.md に追記する
  （新デザインの照合「主張照合の照合日 … が一次資料メモにありません」で止まる。e-Gov API を再取得して確認した事実を書く）。
  生成器は候補を母数にする（build_koshitsu_arena._planet_data、process_sections --input。2026-10-14に対応済み）。
  立場は「今回案全体」への評価。個別論点（女性天皇容認など）から全体賛否を作らないのが2026-09-13以来の基準。
  主張の該当投稿は data/koshitsu-tenpakai_claim_posts.json（<claim>.tweet_ids）。
  build_koshitsu_process_sections.py の CHECKED_AT を今回の日付にし、-claims.json の写しを作り直す。
  施行日（2026-10-24）以降は configs/koshitsu-tenpakai-opening.json の law.enforcement_confirmed_on の扱いを DATA_REFRESH.md で確認。
