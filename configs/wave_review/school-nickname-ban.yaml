title: 学校でのあだ名禁止（さん付け指導）
opinion_guide: 投稿者自身の、学校でのあだ名禁止・さん付け指導（あだ名を禁じる校則や指導、敬称の統一、嫌な呼び名への対応、呼び方と人間関係・いじめとの関係）についての評価・感情・主張・体験に基づく意見が本文から読めるなら true。ニュースの見出しやURL共有だけ、芸能人や漫画・ドラマのあだ名の話、職場や家庭のあだ名、学校の呼称に触れない校則一般の話は意見外。自分や子どもの学校での実際の経験を書き、そこから禁止の良し悪しが読めるなら意見。
issue_guide: いじめ・心理的安全＝嫌な呼び名がいじめにつながる、傷つく・安心して過ごせないという理由／さん付け・ジェンダー配慮＝さん付けへの統一、男女で呼び分けない、敬称の是非／一律禁止の実効性＝全員一律に禁止して効果があるか、過剰管理・形式的ではないかという理由／学校運用・現場体験＝学校での周知・指導の実際、昔と今の呼称の比較、現場の経験談／本人意思・柔軟運用＝悪意の有無や本人が嫌かどうかで決める、本人の選択を尊重するという理由／親しさ・呼称文化＝あだ名の親しさ・個性・文化を残したい、愛称のよさという理由／その他＝上記以外（保護者対応、教員の負担、SNSでの呼称など）。
stance_guide: 禁止支持＝あだ名を禁止する指導に賛成・必要と書く／条件付き・個別対応＝嫌がる呼び名だけ止める、本人が嫌な場合だけ対応する、場面で使い分けるなど条件をつけて容認する／一律禁止に反対＝一律に禁止する指導に反対・疑問・過剰だと書く／中立・情報＝経験談や状況の説明が中心で、禁止への賛否までは読み取れない（皮肉で真意が取れない場合もここ）。被害体験を書いていても、禁止への賛否が書かれていなければ中立・情報。
neutral_stance: 中立・情報
new_issue_examples: 「教員の負担・指導の線引き」「保護者対応」「呼称の強制（さん付けの押し付け）」
notes: |
  専用再読ファイル data/school-nickname-ban_issues-reread.json は平坦な items（post_key 形式、main_issue 付き）＋ buckets[論点]。
  6論点すべてに理由区分あり（「その他」は区分なし。1件でも出たら DATA_REFRESH.md「その他に件数が出たら」）。
  新デザイン（nickname_layout）は再読データの items 件数と公開JSONの意見数・立場の対応表を照合する。
  明細が足りないと refresh_adapters/nickname.py の build_reread_stances が「追い読みが要ります」で止まり、全テーマの候補生成が止まる。
  立場の対応表 data/school-nickname-ban_reread-stances.json は更新経路が作り直すので手で作らない。
  CHECKED_AT 相当（主張の照合日・資料の確認日 configs/school-nickname-ban-opening.json の checked_on）の扱いは DATA_REFRESH.md「学校でのあだ名禁止の定期更新」。
  「資料にしかない話」の母数は data/verification/school-nickname-ban-sunk-continents.json（sns_base は今回の意見数）。
  同文の連投は1件1意見で数え、監査に明記する。
  課題99（2026-10-31棚卸し）: 主張照合が30日以上遅れている。次回更新では quality/reviews/2026-10-31-claim-coverage-plan.json の対象と既存主張を必ず確認する。
  新規投稿の分類確認だけでは完了にしない。既存対象と今回の追加・修正意見を主張ごとに本文で照合し、追加・不採用・判断理由をIDと本文の指紋で記録する。
  一次資料の再取得と投稿の照合範囲は別々に記録する。完了した範囲だけ確認日を進め、claim_posts・検証写し・公開JSONの件数を揃える。
  公開前監査に、照合した範囲・未確認の件数・一次資料の変化・今回の照合記録の場所を明記する。未確認が残る間は照合完了としない。
