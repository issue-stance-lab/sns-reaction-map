title: 生成AIと著作権（生成AIによる著作物の利用・学習をどこまで認めるか）
opinion_guide: 投稿者自身の、生成AIと著作権（学習データの無断利用、クリエイターの権利、AI生成物の権利、法制度・規制、利用者のモラル、技術推進）についての評価・感情・主張が本文から読めるなら true。「気持ち悪い」「パクリじゃん」「便利だからいい」のような感情・評価も意見に数える。
issue_guide: 学習データ・無断利用（無断学習・学習元の是非）／法制度・規制整備（法律・ガイドライン・許諾制度・政府の対応を求める）／利用者モラル・倫理（法律以前に使う人の態度・クレジット表記・配慮）／クリエイター保護・権利（画風の模倣、収入・雇用、作品の保護）／技術競争・推進（国際競争・規制は遅れを招く・便利さ）／AI生成物の権利・創作性（AIで作ったものに著作権があるか、どこからが創作か）／その他（生成AI全般への好悪・派閥対立・品質の評価など、上のどれにも素直に収まらないもの）。
stance_guide: 規制・制限強化支持（生成AIの利用・学習に否定的、規制や保護を求める）／推進・活用支持（生成AIの利用に肯定的、規制に反対）／中立・情報（意見だが賛否が読めない、または意見でない）。「生成AI禁止に賛成」は規制・制限強化支持、「規制派はうるさい」は推進・活用支持のように、批判の矢印がAIの側に向いているか規制・権利主張の側に向いているかで決める。
new_issue_examples: 「AI生成物の表示義務」「声・肖像の無断利用」
notes: |
  2026-10-15 に新ルール（全件本文確認）での初回のため作成。理由区分があるのは5論点（学習データ・無断利用／クリエイター保護・権利／その他／
  AI生成物の権利・創作性／技術競争・推進）。法制度・規制整備と利用者モラル・倫理は理由区分が無い。
  専用ファイル data/ai-copyright_issues-reread.json の各論点の items 件数は公開JSONの論点件数と一致が必要（新デザインの生成が止まる）。
  adapter の review_candidate は 2026-10-15 に consumption_tax.py から移植。
