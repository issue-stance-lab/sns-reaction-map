stance_note: このマップには「論点を切り分ける」という分類があります。文科省判断への賛否を明示せず、事故や報道など別の問題を語る意見も含みます。全員が同じ解決策を支持しているわけではありません。
reading_questions:
- key: g1
  title: ① 安全管理に問題があったと考える人は、文科省判断にも賛成しているのでしょうか？
  opts:
  - 安全を重視するなら、文科省判断にも賛成している
  - 安全への懸念だけでは、文科省判断への賛否は分からない
  - 文科省判断に反対する人は、安全管理を問題にしていない
  right: 1
  ans: 支持する投稿にも反発する投稿にも、安全管理への懸念がありました。安全の是正が必要かという問いと、国が教育内容にどこまで関わるかという問いは分けて読めます。
- key: g2
  title: ② 「論点を切り分ける」に含まれるのは、どのような投稿でしょうか？
  opts:
  - 文科省判断への賛否を示さず、事故や報道の問題を語る意見
  - 文科省判断に賛成する投稿だけ
  - 記事の見出しを共有するだけで、独自の意見がない投稿
  right: 0
  ans: 「論点を切り分ける」には、当該判断への賛否を明示しない意見も含めています。投稿者全員が、明示的に論点を切り分けるよう提案したという意味ではありません。
