# 収集・分類ランナーの実行設定。ページ生成は adapter だけをテーマ別に差し替える。
topics:
  ai-copyright:
    classifier: scripts/classify_aicopyright_arena_hermes.py
    adapter: ai_copyright
  bike-blue-ticket:
    classifier: scripts/classify_bike_arena_hermes.py
    adapter: bike
  bukatsu-chiiki:
    classifier: scripts/classify_bukatsu_arena_hermes.py
    adapter: bukatsu
  constitutional-amendment:
    classifier: scripts/classify_constitutional_arena_hermes.py
    adapter: constitutional
  elderly-license-revocation:
    classifier: scripts/classify_elderly_arena_hermes.py
    adapter: elderly
  school-nickname-ban:
    classifier: scripts/classify_nickname_arena_hermes.py
    adapter: nickname
  henoko-student-accident:
    classifier: scripts/classify_henoko_arena_hermes.py
    # 本文が同一でも投稿者が違う行を落とさない。収集側が tweet_id/URL/本文ハッシュで
    # 重複を除いた後なので、ここで再度まとめると new と classified の件数が食い違う。
    classifier_args: ["--keep-duplicates"]
  takaichi:
    classifier: scripts/classify_takaichi_arena_hermes.py
    adapter: takaichi
  fukushuto:
    classifier: scripts/classify_fukushuto_arena_hermes.py
    adapter: fukushuto
  koshitsu-tenpakai:
    classifier: scripts/classify_koshitsu_arena_hermes.py
    adapter: koshitsu
  consumption-tax-cut:
    classifier: scripts/classify_consumption_tax_arena_hermes.py
    adapter: consumption_tax
