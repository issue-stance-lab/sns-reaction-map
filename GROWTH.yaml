capabilities:
  share-after-vote:
    title: 投票完了後のXシェアボタン
    hypothesis: 投票直後は熱量が最も高く、結果画面にシェア導線を置けばシェア数が増える
    scope: 全テーマ共通。投票結果表示に「結果をXでシェア」ボタン（テーマ名+自分の立場+URL入りテキスト自動生成）
    status: measuring          # 2026-08-10 再開。閉じた根拠が誤っていたため（reflection 末尾）
    priority: 1
    metric: >-
      GA4 utm_source=share_button の流入を sessionCampaignName で分離する
      （fab_share=右下の固定ボタン / vote_share=投票完了後）。あわせてクリックイベント
      fab_share_click / vote_share_click も見る。UTMは流入しか測れないため、
      「押されていない」のか「押されたが戻ってこない」のかはイベント側でしか分からない
    started_at: 2026-07-07
    judge_at: 2026-09-07       # 計測が成立した 2026-08-10 から4週間
    closed_at: null            # 2026-08-10 に再開したため取り消し
    reopen_when: null
    reflection: >-
      2026-07-23時点で過去7日のshare_button流入は0件。実投票は9→11に増えたがシェア起点流入は確認できない。
      7/23に全10テーマの固定XシェアJSの404を解消したため、修正後データを1週間計測する（1回目延長）。
      2026-08-10、修正から18日経っても share_button 流入は0件のまま。ただし同期間の全流入が90PV・9ユーザーしかなく、
      シェアボタンの出来ではなく母数不足と判断し、rejected ではなく closed_undecided で閉じた。


      【2026-08-10 訂正・再開】この判断の前提が誤っていた。母数不足の前に、そもそも計測が存在しなかった。
      公開ページのシェアボタンはどれもUTMを付けておらず（topic-modern.js は location.href を、
      share-x-btn.js は og:url をそのまま渡していた）、GA4では t.co / referral にまとまるため
      share_button として記録され得なかった。UTM付きの実装は vote2d.js と build_reaction_map.py に
      存在したが、前者はどの公開ページからも読み込まれておらず、後者の生成物も公開ページに含まれていない。
      つまり「0件」は施策の失敗でも母数不足でもなく、指標が構造的に発生し得なかったということ。
      PR #73 で全経路にUTMとクリックイベントを入れたので、ここから改めて計測する。
      母数が小さい問題自体は残るため、判定時は流入だけでなくクリックイベント側も併せて見ること。
    notes: >-
      2026-08-10 訂正: 旧notesの「全公開テーマで utm_source=share_button / utm_medium=social /
      utm_campaign=vote_share 付きに統一」は事実ではなかった。統一されていたのは未使用の vote2d.js と
      ビルダーだけで、公開ページの実挙動はUTMなしだった。経緯を追えるよう旧記述はここに引用して残す。
      現在は docs/topic-modern.js の window.buildShareUrl が正典で、FAB・投票後・ビルダーの全経路がこれに揃う。
      OGP画像は整備済みなのでカードは出る。

  related-themes-block:
    title: 投票完了後・ページ末尾の関連テーマ表示
    hypothesis: 読了・投票完了時点が離脱点。そこに関連テーマカードを置けば回遊が増える
    scope: 全テーマ共通。ページ末尾と投票完了画面に他テーマカード2-3枚
    status: measuring          # 2026-08-10 再開。計測が全テーマに届いていなかったため
    priority: 2
    metric: pages_per_session、related_theme_click（GA4イベント。placement で page_bottom / 投票結果内を分離）
    started_at: 2026-07-08
    judge_at: 2026-09-07       # 全11ページで計測が成立した 2026-08-10 から4週間
    closed_at: null            # 2026-08-10 に再開したため取り消し
    reopen_when: null
    reflection: >-
      2026-07-23時点でrelated_theme_clickは0件、公開ホスト限定のpages/sessionは4.250→2.800。母数10ユーザーと少なく、
      導線の効果を判断できないため1週間延長する（1回目延長）。次回も0件なら導線・イベント発火を再点検する。
      2026-08-10、related_theme_click は依然0件。ただしイベントが発火していないのか押されていないだけなのかを
      切り分けていない（前回「再点検する」と書いたまま未実施）。pages/session は 2.800→3.750 に戻ったが
      9ユーザーの小標本で複数施策が並行しており帰属不能。closed_undecided で閉じた。


      【2026-08-10 切り分け結果・再開】積み残していた点検を実施した。
      related_theme_click を発火させるインラインJSは公開11ページ中8ページにしか無く、
      fukushuto / koshitsu-tenpakai / takaichi の3ページは関連テーマ枠が表示されているのに
      クリックが記録されていなかった。とくに fukushuto は featured（トップの注目テーマ）で、
      最も流入があるページ。8ページ側は page_bottom・投票結果内の両方を計測できており実装は正しい。
      つまり0件は「押されていない」と「そもそも記録していない」が混ざった状態だった。
      docs/topic-modern.js に未実装ページ用の受け皿を入れ（既存実装があるページでは二重送信しない）、
      全11ページで計測が成立することをローカルで実クリック確認した。ここから改めて計測する。
      母数の小ささは依然として残る問題なので、判定時は0件の理由を必ず切り分けること。
    notes: >-
      ポータルの回遊カード実装を流用。2026-07-07に8テーマへ投票結果内関連テーマと related_theme_click
      GA4イベントを実装。share-after-voteとは別指標（回遊 vs X流入）のため並行計測開始（2026-07-08）。
      2026-08-10 追記: この「8テーマ」が全テーマではなかったことが判定を止めていた。
      関連テーマ枠自体は11ページすべてにあるが、計測は8ページのみだった。
      受け皿は docs/topic-modern.js 側に置いたので、今後ページを増やしても計測は自動で付く。

  portal-featured-slot:
    title: トップページの注目テーマ枠
    hypothesis: 新着・話題性の高いテーマを最上部に出すと初回訪問者の直帰が減る
    scope: ポータルに「注目」枠1つ。GROWTH.yaml の featured フィールドで指定
    status: closed_undecided
    priority: 3
    metric: ポータルからテーマページへの遷移率
    started_at: 2026-07-05
    judge_at: 2026-07-30
    closed_at: 2026-08-10
    reopen_when: 注目枠のクリックを個別のGA4イベントとして取れるようにしてから再計測する。それが無い限り何度延長しても判定できない
    reflection: 2026-07-23時点でトップ系ページは合計56PVあるが、注目枠からテーマへの遷移イベントを個別取得できておらず効果判定不能。現行の副首都枠で1週間延長する（1回目延長）。2026-08-10、**計測手段が無いまま延長していたので、延長しても判定できるはずがなかった**。トップ系は index.html 36PV＋トップ6PVで計42PV、テーマページ最多は消費税減税6PV。注目枠は fukushuto のままだが fukushuto のPVは4で、枠の効果があるとは言えない（ただし母数不足で否定もできない）。closed_undecided で閉じる。枠自体は残す
    notes: school-nickname-ban から fukushuto に切り替え済み

  x-post-templates:
    title: X投稿テンプレート自動生成
    hypothesis: テーマごとの定型投稿（問題提起+スタンスマップ画像+URL）を用意すれば投稿頻度が上がる
    scope: 新テーマ公開時・データ補充時にハブが投稿文案を生成し人間に渡す運用をループに組み込む
    status: closed_undecided
    priority: 4
    metric: x_followers、X経由流入（GA4）
    started_at: 2026-07-05
    judge_at: 2026-07-30
    closed_at: 2026-08-10
    reopen_when: Xのリーチが流入に変換されない原因が分かってから。テンプレートの型を比べるのは、リンクが踏まれる場所を確保したあとの話
    reflection: >-
      2026-07-23時点でXフォロワー数は未取得。直近投稿対象の副首都は過去7日58PV、皇室典範は32PVで上位だが
      UTM帰属は確認できない。X活動を継続し、フォロワー数の手動確認と合わせて1週間延長する（1回目延長）。
      2026-08-10、この施策は前提から崩れている。投稿文の型を比べる以前に、リーチのある枠にURLが乗っていない。
      closed_undecided で閉じ、この問題は別途「Xのリーチが流入にならない件」として調査する。


      【2026-08-10 訂正】上記の閉じる判断は維持するが、根拠に挙げた数字が誤っていた。
      「同時期のリプライは9.4K〜871K（約1,000倍差）」「直近30日でリプライ87本・表示7.6M」は、
      いずれも返信先（元投稿）の表示回数であって、自分のリプライが読まれた回数ではない。
      実測した自リプライ表示は8/6の3本で155、8/7〜8/10の13本で1,853。1本あたりの中央値は51。
      URL付き通常ポストの10表示との差は約1,000倍ではなく、中央値で見て数倍〜十数倍。
      また「サイトのページ閲覧90」はGA4の7日間、7.6Mは30日間で期間も揃っておらず、両者は比較できない。
      結論（リーチのある枠にURLが乗っていない）は変わらないが、差の大きさを誇張した記述だったため訂正する。


      なお主指標の x_followers は初回スナップショット（2026-07-06）以外すべて null で、
      **一度も継続取得できていない。** 再開するなら、まず取得手順を決めること。
    notes: school-nickname-ban の投稿文案を初回生成済み（下記参照）

