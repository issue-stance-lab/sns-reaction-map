# THEMES.yaml — テーマ台帳（単一の真実源）
# 最終更新: 2026-08-02
#
# 工程の定義（全テーマ共通のステートマシン）
#   collect:     Yahoo検索でデータ収集済み
#   classify:    AI分類済み（1D）
#   classify2d:  2D分類済み（エラー率10%以下）
#   page_v3:     v3フォーマットのHTMLが公開されている
#   manga_data:  漫画データ・プロンプト作成済み
#   manga_img:   画像生成・HTML反映済み（画像生成は人間の手動作業）
#   published:   ポータル掲載・sitemap登録済み
#
# 各工程の値: done / partial / todo / blocked / n-a
#
# データ更新フィールド（2026-08-02 の部活動パイロットで意味を固定）
#   updated_at:               検証済みデータを公開した日。全検査に合格した時だけ進める
#   collect_delta:            今回の重複除外後・分類済み追加件数
#   sample_period:            公開累積データの収集日の範囲（投稿日時ではない）
#   collect_at:               次回の収集・staging作成予定日（内部運用用）
#   collect_mode:             scheduled（既定）/ event-driven（新規0件が2回続き定期収集を停止）
#   refresh_at:               次回の公開更新予定日。公開まで昇格できないテーマは空欄
#   last_refresh_attempt_at:  収集を試みた日。新規0件や失敗でも記録する
#   refresh_config:           収集条件（検索語）の正典ファイル
#   sample_file:              ページ生成用の累積正典。本文を含むため Git 管理外のテーマがある
#   verification_file:        本文を除いた検証用サマリ（data/verification/）。クリーンクローンとCIはこれを読む
#   page_update_mode:         ページ更新の自動化可否（2026-08-02 の実測で判定）
#     adapter   … stagingの候補入出力に対応し、変更候補の2回目実行で差分が出ない
#     adapter_candidate … 現行入力では冪等だが、stagingの候補入出力には未対応
#     migration … 一度きりの生成スクリプトしかない。再実行できないか副作用があるため自動化対象外
#     manual    … 再実行可能な更新スクリプトが存在しない
#
# collect_at / refresh_at の決め方
#   既定は前回収集から14日。1回の更新で新規意見が50件以上なら次回だけ7日後。
#   新規意見が20件未満の回が2回続いたら28日へ下げ、新規0件が2回続いたら定期更新を止めて空欄にする。
#   collect_at は全テーマに設定し、refresh_at は公開まで昇格できるテーマだけに設定する。
#   collect_at を空欄にできるのは collect_mode: event-driven を明記したテーマだけ。
#   同じ日に予定が集まらないよう、日付は意図的に分散させる（2026-08-02 に10テーマが同時期限に
#   なった反省）。公開まで行うテーマ（page_update_mode: adapter）は1日1テーマを上限にする。
#   収集だけのテーマは判断がほぼ発生しないため、同じ日にまとめてよい。
#   オーナーが作業できない日が分かっている場合は、期限を過ぎさせず事前に前後へ動かす。
#
# バッジ自動制御フィールド（index.html JS が参照。値は sync_portal_stats.py が生成する）
#   published_at:  初回ポータル公開日  → NEW バッジ（14日間）
#   updated_at:    最終データ追加日    → +XX件 更新バッジ（7日間）
#   collect_delta: 直近追加件数        → +XX件 の数字
#   x_posted_at:   最終X投稿日         → 🔥 注目バッジ（2日間）

