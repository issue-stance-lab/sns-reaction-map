    notes: "2026-07-26にYahooリアルタイム検索72件を追加収集しHermes再分類。22件が意見投稿と判定。7/12収集31件との比較「世論の潮目」ウィジェットを追加（賛成54.5%↑、反対45.5%↓）。 2026-08-16にページ冒頭をテーマ固有の入口へ組み替えた。ヒーローの『議論の中心』要約を外し、STEP1集め方（検索語10本と181→115件の絞り込み）／STEP2確かめ方（投稿の主張7つを警察庁資料と突き合わせ）／STEP3分かったこと（賛成38・反対77の帯が6区分へ分解するアニメーション）の順に置いた。中心の発見は『反対77件は一つの塊ではない』こと。編集部が反対77件を全件読み直し、青切符では足りない9／対象と順番に異議30／走る場所がない10／警察の運用への不信14／制度そのものに反対14（うち8件は同一の署名定型文）に再区分した。取締り自体の否定と読めるのは115件中14件。再読の割り当ては data/bike-blue-ticket_opposition_reread.json、事実確認7主張の該当投稿IDは data/bike-blue-ticket_claim_posts.json に保存し、件数はスクリプトが毎回数え直す（本文のキーワード抽出をそのまま件数にすると3〜4割多く出たため、1件ずつ読んで確定した）。事実確認の結果は、反則金の額・対象16歳以上が一致、LUUPは野放しという前提・歩道通行で即反則金・事故の増減・取締り不在の4つが資料と食い違い、『違反113種類』のみ確認できず（警察庁の反則行為一覧は65項目。別の数え方の可能性を否定できないため誤りとは書かず両論併記）。確認日2026-08-16。全件表は反対77件を掲載し、AIがrisk=medium等と判定した11件は本文抜粋を載せずリンクのみ。insight-statsは『取締り38 vs 道路整備77』の2値表示をやめ5論点の内訳に変更しアリーナ直前へ移動。世論の潮目は5論点の後ろへ移動。conclusion-countは reread-basis セクション内に1つだけ置いてsync_issue_countsの対象を維持している。データ追加時は新規の反対投稿だけを読んで再読マッピングに追記する（件数が合わないとビルドが落ちる）。次テーマへ展開する場合はSTEP2から移すこと。STEP3は結論次第で形が変わるため定型化しない。 2026-08-17に公開更新。2026-08-10収集回（新規153件）と2026-08-17収集回（新規152件）はどちらも累積正典に取り込まれておらず、重複131件を除いた174件をまとめて統合し累計355件。追加分に is_opinion が付かないため、既存181件と同じ扱い（全件を意見として数える）で true を付与した。反対65件を1件ずつ読み直して再読マッピングへ追記し、5区分は 青切符では足りない14／対象と順番に異議41／走る場所がない18／警察の運用への不信22／制度そのものに反対47（うち29件が同一の署名定型文）。反対が77→142件へ増えた分の約半分は change.org の署名文の貼り付けで、STEP3の本文と潮目の注記に明記した。署名文の件数と全件表で本文を伏せた件数は、data/verification/bike-blue-ticket-reread.json にsignature / excerpt 列として書き出し、数字の出所検査から導けるようにした（直書きをやめた）。事実確認7主張の該当投稿も再走査して37→64件。潮目は7月26日収集回×8月17日収集回の比較へ差し替え（賛成38.7%→28.0%、反対61.3%→72.0%）。論点アリーナの点（SM_RAW）は2026-06の旧1D分類のまま181点で止まっていたので scripts/build_bike_arena_points.py を新設し、正典から355点で作り直した。要旨に一次情報の件数が入るため、この配列だけ id=bike-arena-points のscriptに入れてexclude_selectors で数字の出所検査から外している。 2026-08-17にadapterへ昇格。scripts/build_bike_arena.py が正典からアリーナの点・注目ポイント4枚・論点ごとの帯と内訳（論点×立場のクロス集計）・「本当の対立点」の論点別件数・投票の選択肢の説明文の件数を作り直し、scripts/build_bike_process_sections.py が候補input/outputに対応した。潮目は固定ファイル名をやめ、refresh_adapters/bike.py が更新回どうしを比較して作る（inject_tide_widget.py の THEMES からは prev_file/cur_file を外した）。新しい反対投稿が data/bike-blue-ticket_opposition_reread.json に無ければ、adapterが tweet_id を並べて意図的に失敗する（読む工程は自動化しない）。is_opinion は分類器が全件 true で付ける（このテーマは収集した投稿を全件母数に数える）。"

