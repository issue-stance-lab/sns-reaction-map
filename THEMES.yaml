    notes: "2026-07-12にYahooリアルタイム検索463件を追加収集。重複7件を除外し、新規456件中369件をOpenCode Go / minimax-m2.7で2D有効分類。2026-07-22に論点アリーナ（極座標7セクター・2ステップ投票）と論点説明カード6枚を追加。学習データ・無断利用126件最多、技術競争・AI推進のみ推進派優勢（6vs27）。2026-07-26に452件を追加収集しHermes1D分類（規制支持78→60%、推進支持22→41%の大きな変化）、「世論の潮目」ウィジェットを追加。2026-08-02に arguments（両側の強い論拠）を追加。一次情報は文化庁「AIと著作権に関する考え方について」（令和6年3月15日）と内閣府「AI時代の知的財産権検討会 中間とりまとめ」（2024年5月）。論点別件数の出所は sample_file（ai-copyright_2d_classified.json）の main_issue で、有効669件・その他274件を除く6論点が126/79/73/46/40/31。hermes_cur/prev は別タクソノミーでページには未使用。 2026-08-19、投稿の言い分を一次資料と突き合わせるセクション「その言い分、原典に当たるとどうなるか」を追加（FACT_CHECK_GUIDE.md。AdSense診断でExperienceだけがNGだったことへの反証）。公の記録で当否を判定できる言い分を6つ選び、該当投稿72件を1件ずつ読んで確定（data/consumption-tax-cut_claim_posts.json）。判定は原典どおり2・原典とズレ3・原典に届かず1。『2年後に10%に戻る』は軽減税率8%へ戻るので食い違い、『5兆円かかる』は片山財務大臣の答弁（衆院予算委2026-06-22）が約4.3兆円で食い違い、『全額社会保障』は消費税法1条2項と予算総則のとおりだが令和8年度予算では消費税収34.0兆円に対し社会保障4経費48.9兆円で足りていない。『輸出企業へ11.7兆円の還付』は、国税庁が公表しているのが還付申告税額の合計（令和4年で7兆円超）だけで輸出分を区分した公表値が無く、確認できずのまま残した（オーナー判断で掲載）。生成器は新設せず build_consumption_tax_page.py に組み込み、CLAIM_AUDIT_START/END の間だけを差し替える。公開ページを直すときは --claim-audit-only を使うこと。通常ビルドは潮目ウィジェットを必ず外す作り（adapterが貼り直す前提）なので、公開ページに対して素で流すと潮目が消える。件数の出所は data/verification/consumption-tax-cut-claims.json に書き出し、configs の number_provenance.sources に登録した。verify_theme_page.py のspan検査は中身が「N件」だけのspanを弾くため、表示は「該当した投稿 N件」にしてある。"

