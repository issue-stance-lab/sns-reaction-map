    notes: "2026-07-17のYahooリアルタイム検索。皇室典範改正が同日参院で可決・成立した直後で投稿殺到中。trend_judgeはGO（スコア9/10、意見率60-70%）。9クエリで326件取得済み。2D分類完了（OpenCode Go minimax-m2.7）。stance_reform（反対140/中立103/賛成30）stance_succession（男系95/中立133/女系45）。main_issue分布: 男系vs女系75/養子制度54/立法手法54/女性天皇の区別24/愛子さま5/その他56。2026-07-26に347件を追加収集しHermes1D分類（改正賛成11→20%に増加）、「世論の潮目」ウィジェットを追加（前回は2Dスタンス統計から合成）。2026-08-02にページの論点表示を正典 sample_file へ統一（S8-fix / 課題30）。それまでアリーナSM_RAW・論点カード・争点別のXの声・スタンス集計・詳細データは7/17収集分（268件）のままで、sample_file（7/26収集の347件）とURLが1件も重ならない状態だった。件数だけは「それらしい数字」だったため気づけなかった。論点カードの `女性皇族の皇籍維持` `憲法・制度上の妥当性` はAI分類ではなくページ内 arenaIssueOf() の正規表現が作った擬似ラベルで、正典に対応が無かったため廃止。scripts/build_koshitsu_arena.py が sample_file だけを読んでSM_RAW・ISSUES・VOTE_ISSUES・注目ポイント・争点別のXの声・スタンス集計・詳細データ・カード件数を再生成する（再実行可能・--checkあり）。論点は件数降順で 男系vs女系104/旧宮家養子縁組74/立法手続き・民主主義54/女性天皇・女系天皇40/愛子さま・皇族の地位17/その他58。カードは「その他」を除く5枚。arenaIssueOf() は p.i の直参照に置き換え、要約文からの推測をやめた。投票の選択肢が7→6に変わり choiceIdx の意味がずれるため topicId を v2 へ上げ、supabase/functions/cast-vote/index.ts に \"koshitsu-tenpakai-issue-stance-v2\": 24 を追加した（**Edge Function の再デプロイが必要。未デプロイだと投票が invalid_topic で失敗する**）。v1 の既存票は集計から外れる。旧2D分類由来の「皇位継承観（stance_succession）」は正典に対応データが無いため注目ポイント・スタンス集計・詳細データから削除した。「世論の潮目」ウィジェットの前回値のみ合成データ（_prev_synthetic）由来のままで、注釈で開示済み。同日、争点⑤「愛子さま・皇族の地位」のwide図解を生成・反映（1916×821px・140KB、cwebp -q 80）。初版は「サンプル17件」を画像に焼き込んでいたため同日中に数値なしの版へ差し替えた。図解に件数・％・サンプル数を入れないルールを manga-prompts/koshitsu-tenpakai-infographic-prompts.md に明記した（データ補充のたびに画像だけ古くなるため）。2026-08-12に、8/10へ前倒し収集していた回（取得325・重複0・意見258・分類エラー0）を初めて --promote で昇格し、累計672件・意見541件になった。論点は 男系vs女系172／旧宮家養子縁組119／立法手続き・民主主義87／女性天皇・女系天皇57／その他56／愛子さま・皇族の地位50、賛否は改正反対286／改正賛成143／中立・情報112。これで「世論の潮目」の前回値が合成データ（_prev_synthetic）から実データ（7/26収集分347件）へ入れ替わり、課題31が解消した。同時に build_koshitsu_arena.py が調査条件の取得期間と詳細データの「収集クエリ」も生成するようにした。それまで取得期間はページに固定で書かれており、収集回が増えると THEMES.yaml の sample_period とズレて verify_theme_page.py が落ちた。検索語の一覧は7/17収集時のもの（皇室典範 改悪・愛子天皇など）が残っていたので、refresh_config の実際の9語から出すようにした。この昇格で sync_portal_stats.py の「更新バー本文」も直した。テーマ名に括弧が入ると `（.*?）` が題名の途中で切れ、2回目の実行で違う文字列になってトップページの空振り検査が落ちる（括弧つきの題名が最新更新になったのはこのテーマが初）。2026-08-20に8/20収集分（295件・意見225件）を昇格し累計967件・意見766件になった。同時に「投稿の主張を一次資料と突き合わせる」セクション（KOSHITSU_AUDIT）を追加。4主張を選定しe-Gov法令検索・内閣官房公表資料と突き合わせた結果は fact2件・miss2件（養子継承規定は改正後条文が未取得、有識者会議の賛否内訳集計表は公開資料から確認できず）。scripts/build_koshitsu_process_sections.py が data/koshitsu-tenpakai_claim_posts.json（14件）を読み KOSHITSU_AUDIT_START/END マーカー間を差し替える。data/verification/koshitsu-tenpakai-claims.json を新設し verify_number_provenance.py の pv-count 照合先にした。2026-08-21にKOSHITSU_AUDITセクションを強化（4件→6件、fact2/miss2→fact4/miss2）。追加した claim_5: 継承資格者3名（有識者会議報告書が「秋篠宮皇嗣殿下・悠仁親王殿下・常陸宮正仁親王殿下の三方」と明記、fact）、claim_6: 典範第二条の継承順序（「皇長子→皇長孫…長系を先にし、同等内では長を先にする」、fact）。claim_4（有識者会議11人/7人）は報告書本文を確認し「ヒアリングの中では、ほとんどが変更すべきでないと答え、一つのみが直ちに変更すべきと述べた」という記述は確認できたが、11人/7人という具体的内訳表は本文中になかった（参考資料8は別文書で未確認）ためmissのまま、noteを充実。書き出し文を自転車ページとの類似度が下がる表現に書き直し（0.69→改善）。"

