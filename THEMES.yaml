    notes: "2026-07-28に新規テーマとして収集。trend_judgeはGO（スコア9/10、意見率100%、投稿量2、対立性2、SEO需要2、広告安全性1）。食料品への限定的な消費税減税が高市政権で決着しつつあるタイミングで収集。20クエリで667件（batch1 324件 + batch2 382件、重複34件除外）。Hermes（kimi-k2.6）で7論点・4スタンス・3段階強度を分類。関連666件、意見612件と意見率91.8%は全テーマ中最高。スタンス内訳は減税推進299（48.9%）/条件付き賛成・政府案に不満109（17.8%）/減税反対・慎重163（26.6%）/中立41（6.7%）。副首都・皇室典範の3スタンスでは「減税は賛成だが政府案は中途半端」が表現できないため部活動と同じ4スタンス構成を採用し、アリーナの点の色をx座標ベースから立場インデックスベースへ変更。論点は公約と政治不信が43.6%と突出し、税制の中身より政治の姿勢を問う投稿が中心。ページはscripts/build_consumption_tax_page.py が副首都ページをテンプレートに生成（再実行可能）。topic-modern.cssの.hero::beforeは--topic-hero-image未指定だとai-copyright-hero.webpにフォールバックするため、必ずbodyのinline styleで指定すること。2026-07-29にヒーロー画像を生成・反映（manga-prompts/consumption-tax-cut-hero-prompt.md、買い物カゴ＋レシート折れ線＋値札の境界＋天秤の抽象俯瞰型、OGPも同画像）。同日、論点別インフォグラフィックwide6枚も生成・反映（manga-prompts/consumption-tax-cut-infographic-wide-prompts.md、1915×821px・156〜188KB）。explainerセクションを画像つきカード＋拡大モーダル版に切り替え済み。「その他」は6件と少なく図解を作っていない（自転車青切符と同じ扱い）。テンプレート元の副首都ページはSEOスクリプトで随時書き換わるため、build_consumption_tax_page.py に生成後の自己検証（タイトル・h1・canonical・保護タグ・SM_RAW件数・副首都由来の残留参照・図解6枚・賛否バー合計100%・trustブロック・回遊カード）を組み込んである。2026-07-29に公開: configs/site-cases.json と configs/theme-seo.json に登録（両者のURL集合が一致しないとapply_theme_trust.pyが落ちる）、sitemap登録、index.htmlにトピックカード追加（hero-total-samples 5,953／公開中のテーマ11）、副首都・憲法改正から相互リンク、投票後の回遊カードを追加。 2026-08-17にadapterへ昇格し、8/3・8/10・8/17の3回分をまとめて公開更新した。build_consumption_tax_page.py は副首都ページをテンプレートに読む一度きりの生成器だったので、--input / --html-template / --output-html を付け、既定のテンプレートを自分自身の公開ページへ変えた（副首都ページはSEOスクリプトで随時書き換わり、読み続けると他テーマの変更が漏れ込む）。2回目の実行で差分が出ていたのは、回遊カードのスクリプトの追記・.side.mid の追記・潮目前後の空行の3か所。投票は「論点の番号×立場の番号」で保存されるため、件数順の並びが入れ替わると過去の投票の意味が変わる。そのため公開後は pinned_issue_order でページの並びを固定する（8/3分を足した時点で対象範囲と減税の効果が入れ替わり、adapterの投票互換性検査が実際に止めた）。調査条件（取得元・期間・件数）は昇格後に finalize が貼り直す。潮目は inject_tide_widget.py にテーマを追加し、adapterが更新回どうしを比較して作る。3回分は1回ずつ公開できない（途中の状態が collect_at 期限超過で必ず落ちる）ため、refresh_topic.py に --include-wave を足して保管済みの更新回を1つの候補へ畳み込んだ。重複40件を除いた新規1,947件で累計2,614件・意見1,730件。"
