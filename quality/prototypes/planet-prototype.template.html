<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>議論の惑星 試作 — 部活動の地域移行</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --line:#2b3440; --fg:#e6edf3; --muted:#8b949e;
  --accent:#58a6ff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 64px}
h1{font-size:22px;margin:0 0 4px}
.q{color:var(--muted);font-size:14px;margin:0 0 12px}
.caution{background:#1c2128;border:1px solid var(--line);border-left:3px solid #d9a520;
  border-radius:6px;padding:10px 12px;font-size:12.5px;color:#c9d1d9;margin:0 0 16px}
.proto-tag{display:inline-block;background:#d9a520;color:#1c2128;font-size:11px;font-weight:700;
  padding:2px 8px;border-radius:99px;vertical-align:middle;margin-left:8px}
.modes{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.modes button{background:var(--panel);color:var(--fg);border:1px solid var(--line);
  border-radius:99px;padding:6px 13px;font-size:12.5px;cursor:pointer;font-family:inherit}
.modes button[aria-pressed=true]{border-color:var(--accent);background:#1f6feb33;font-weight:700}
.stage{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:820px){.stage{grid-template-columns:1fr}}
.canvas-box{position:relative;background:radial-gradient(circle at 50% 40%,#12181f,#0a0d12);
  border:1px solid var(--line);border-radius:12px;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:auto;cursor:grab}
canvas.dragging{cursor:grabbing}
.hint{position:absolute;left:10px;bottom:8px;font-size:11px;color:var(--muted);pointer-events:none}
.zoombar{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:5px}
.zoombar button{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);
  background:#161b22cc;color:var(--fg);font-size:15px;cursor:pointer;line-height:1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 15px}
.panel h2{font-size:16px;margin:0 0 2px}
.panel .sub{color:var(--muted);font-size:12px;margin:0 0 10px}
.bar{display:flex;height:22px;border-radius:5px;overflow:hidden;margin:8px 0 4px}
.bar span{display:flex;align-items:center;justify-content:center;font-size:10.5px;color:#0d1117;
  font-weight:700;overflow:hidden;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted);margin-bottom:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.islands{list-style:none;padding:0;margin:8px 0 0}
.islands li{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:13px}
.islands li:first-child{border-top:none}
.islands .n{margin-left:auto;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.islands .sw{width:12px;height:12px;border-radius:3px;flex:none}
.islands .num{width:19px;height:19px;border-radius:99px;flex:none;background:#0d1117;
  border:1px solid var(--line);font-size:11px;display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-weight:700}
.islands li.unread{color:var(--muted)}
.note{font-size:12px;color:var(--muted);background:#1c2128;border:1px dashed var(--line);
  border-radius:6px;padding:9px 10px;margin-top:10px}
.back{margin-top:12px;background:transparent;border:1px solid var(--line);color:var(--fg);
  border-radius:7px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-family:inherit}
.issue-list{list-style:none;padding:0;margin:18px 0 0;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:8px}
.issue-list button{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);
  border-radius:9px;padding:9px 11px;color:var(--fg);cursor:pointer;font-family:inherit;font-size:13px}
.issue-list button:hover,.issue-list button:focus-visible{border-color:var(--accent);outline:none}
.issue-list .m{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.dot{display:inline-block;width:9px;height:9px;border-radius:99px;margin-right:6px}
h3.sec{font-size:13px;color:var(--muted);font-weight:700;margin:26px 0 6px;
  border-top:1px solid var(--line);padding-top:14px}
.meta{font-size:11.5px;color:var(--muted)}
.meta code{background:#1c2128;padding:1px 5px;border-radius:4px}

/* JS・canvas が使えないときの静的表示（内容は生成器が data から作る） */
.planet{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;margin:0 0 20px}
.continent{display:flex;flex-direction:column;align-items:center;justify-content:center;
  aspect-ratio:1;border-radius:50%;border:2px solid transparent;text-align:center;
  padding:12px;text-decoration:none;line-height:1.4}
.continent:hover,.continent:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.continent .label{font-size:13px;font-weight:700}
.continent .count{font-size:11px;opacity:.78;font-variant-numeric:tabular-nums}
.landing-panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:14px 15px;margin:0 0 12px}
.landing-panel h2{font-size:16px;margin:0 0 2px}
.landing-panel .sub{color:var(--muted);font-size:12px;margin:0 0 10px}
.srclist{list-style:none;padding:0;margin:8px 0 0;font-size:12px}
.srclist li{padding:5px 0;border-top:1px solid var(--line)}
.srclist li:first-child{border-top:none}
.srclist a{color:var(--accent)}
.backlink{display:inline-block;margin-top:12px;border:1px solid var(--line);color:var(--fg);
  border-radius:7px;padding:6px 12px;font-size:12.5px;text-decoration:none}
.backlink:hover,.backlink:focus-visible{border-color:var(--accent);outline:none}

/* 資料との照合（着陸パネルの後半） */
.claims{list-style:none;padding:0;margin:6px 0 0}
.claims li{padding:8px 0;border-top:1px solid var(--line);font-size:12.5px}
.claims li:first-child{border-top:none}
.verdict{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;
  padding:1px 7px;margin-right:7px;color:#0d1117;vertical-align:2px}
.v-fact{background:#3fb950}.v-gap{background:#d9a520}.v-miss{background:#a5a5a5}
.claims .finding,.claims .vnote{display:block;color:var(--muted);font-size:11.5px;margin-top:3px}
.claims .srcs{display:block;margin-top:4px}
.claims .srcs a{color:var(--accent);font-size:11.5px;margin-right:10px}
.dive{color:var(--accent)}

/* 海面より下 */
.ocean{border-top:1px solid var(--line);margin-top:26px}
.ocean .sec{border-top:none;padding-top:0;color:var(--fg);font-size:15px}
.subsec{font-size:12.5px;color:var(--muted);font-weight:700;margin:18px 0 8px}
.sunk,.vein{background:var(--panel);border:1px solid var(--line);border-left:3px solid #2d6b8f;
  border-radius:10px;padding:12px 14px;margin:0 0 10px}
.vein{border-left-color:#7D5BA6}
.sunk h5,.vein h5{font-size:13.5px;margin:0 0 6px}
.sunk .impact,.vein .impact{font-size:12.5px;margin:0 0 6px}
.sunk .count,.vein .count{font-size:12px;color:var(--muted);margin:0 0 6px}
.sunk .srclist .when,.sunk .srclist .where{display:block;color:var(--muted);font-size:11px}
.sides{list-style:none;padding:0;margin:6px 0 0;font-size:12px}
.sides li{display:flex;padding:4px 0;border-top:1px solid var(--line)}
.sides .n{margin-left:auto;color:var(--muted)}

/* 惑星が描けたときだけ静的表示を隠す。描けないときは操作系を隠す */
.planet-live #fallback{display:none}
html:not(.planet-live) .modes,
html:not(.planet-live) .stage,
html:not(.planet-live) .sec-live,
html:not(.planet-live) .issue-list{display:none}
</style>

<script>
/* 惑星は canvas 2D で描く。JS か canvas が使えない環境では静的表示のまま残す。
   （このクラスが付かないと #fallback が見えたままになる） */
(function(){
  try {
    var c = document.createElement('canvas');
    if (c.getContext && c.getContext('2d')) {
      document.documentElement.className += ' planet-live';
    }
  } catch (e) {}
})();
</script>

<div class="wrap">
  <h1>議論の惑星<span class="proto-tag">試作・非公開</span></h1>
  <p class="q" id="q"><!--__QUESTION__--></p>
  <!--__CAUTION__-->

  <div class="modes" id="modes" role="group" aria-label="立場フィルター"></div>

  <div class="stage">
    <div class="canvas-box">
      <canvas id="cv" width="640" height="640" tabindex="0"
              aria-label="論点の惑星。下の一覧からも同じ内容を読めます"></canvas>
      <div class="zoombar">
        <button type="button" id="zin" aria-label="拡大">＋</button>
        <button type="button" id="zout" aria-label="縮小">−</button>
      </div>
      <div class="hint">ドラッグで回転 / ホイールで拡大 / 大陸をクリックで着陸</div>
    </div>
    <div class="panel" id="panel"></div>
  </div>

  <!--__FALLBACK__-->

  <!--__OCEAN__-->

  <h3 class="sec sec-live">論点一覧（3Dが使えなくても同じ内容へ行けます）</h3>
  <ul class="issue-list" id="list"></ul>

  <h3 class="sec">この試作の見かた</h3>
  <p class="meta" id="meta"><!--__META__--></p>
</div>

<script>window.PLANET_DATA=/*__PLANET_DATA__*/null;</script>
<script>
(function(){
"use strict";
const D = window.PLANET_DATA;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- 状態 ---------- */
const st = {
  yaw: 0.6, pitch: -0.15, zoom: 1,
  mode: "all", landed: null, islandMix: 0,
  dragging: false, quality: 1, anim: null
};
const stanceMap = {}; D.stances.forEach(s => stanceMap[s.key] = s);
const issues = D.issues;
const idIndex = {}; issues.forEach((it,i) => idIndex[it.id] = i);
const modeById = {}; D.modes.forEach(m => modeById[m.id] = m);

/* ---------- 色 ---------- */
function hex2rgb(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function mix(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
const WHITE=[236,240,244];
// 大陸の色 = 最多立場の色。純度が低いほど白っぽく（＝割れている論点）
function continentRGB(it, modeId){
  const key = (modeId === "all") ? it.top_stance : modeId;
  const base = hex2rgb((stanceMap[key]||stanceMap[it.top_stance]).color);
  if (modeId !== "all"){
    // 立場を絞ると全部同じ色になるので、明るさを少しずつ変えて大陸の区切りを見せる
    const r = idIndex[it.id] / Math.max(1, issues.length-1);
    return mix(mix(WHITE, base, 0.95), WHITE, 0.05 + 0.42*r);
  }
  const purity = it.purity_pct/100;
  const t = Math.min(1, Math.max(0, (purity-0.30)/0.45));   // 純度30%→100%を薄い→濃いへ
  return mix(WHITE, base, 0.58 + 0.42*t);
}
const PATTERN = {plain:0, diagonal:1, dots:2, mesh:3};
const DARK=[26,32,40];
function islandRGB(it, modeId, j, m, unread){
  if (unread) return [116,124,134];
  const base = continentRGB(it, modeId);
  const t = m > 1 ? j/(m-1) : 0;
  return mix(mix(base, DARK, 0.42), WHITE, 0.92*t);   // 濃い→淡いの段階
}
function css(c){ return "rgb("+c.map(v=>Math.round(v)).join(",")+")"; }

/* ---------- 幾何 ---------- */
function rot(yaw, pitch){
  const cy=Math.cos(yaw), sy=Math.sin(yaw), cp=Math.cos(pitch), sp=Math.sin(pitch);
  // view = Ry(yaw) then Rx(pitch);  world = Rinv * view
  return [
    [cy, sy*sp, sy*cp],
    [0,  cp,   -sp   ],
    [-sy, cy*sp, cy*cp]
  ];
}

/* ---------- 描画 ---------- */
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d", {alpha:false});
const off = document.createElement("canvas");
const octx = off.getContext("2d", {alpha:false});
let img = null;

function activeIssues(){
  const m = modeById[st.mode];
  return issues.map((it,i)=>({it, i, on: m.counts[it.id] > 0}));
}

function render(){
  const size = Math.round(cv.width * (st.dragging ? 0.55 : 1));
  if (off.width !== size){ off.width = off.height = size; img = octx.createImageData(size,size); }
  const data = img.data;
  const R = rot(st.yaw, st.pitch);
  const W = D.weights_by_mode[st.mode];
  const acts = activeIssues();
  const cols = issues.map(it => continentRGB(it, st.mode));
  const pats = issues.map(it => PATTERN[(stanceMap[st.mode==="all"?it.top_stance:st.mode]||{}).pattern] || 0);
  const landed = st.landed;
  const sub = landed !== null ? issues[landed].sub : null;
  const hasIsl = sub && sub.status === "reread" && st.islandMix > 0.01;
  const islCols = hasIsl
    ? sub.items.map((x,j)=>islandRGB(issues[landed], st.mode, j, sub.items.length, x.unread))
    : null;

  const half = size/2, radius = half*0.94*st.zoom;
  const zq = st.zoom;   // 拡大率。境界線と等高線の幅をこれで割って一定に見せる
  // 光の向き（左上から）
  const lx=-0.45, ly=-0.5, lz=0.74;

  for (let py=0; py<size; py++){
    const y = (py - half)/radius;
    for (let px=0; px<size; px++){
      const o = (py*size+px)*4;
      const x = (px - half)/radius;
      const r2 = x*x + y*y;
      if (r2 > 1){ data[o]=10;data[o+1]=13;data[o+2]=18;data[o+3]=255; continue; }
      const z = Math.sqrt(1-r2);
      // 視線座標 -> 世界座標
      const wx = R[0][0]*x + R[1][0]*(-y) + R[2][0]*z;
      const wy = R[0][1]*x + R[1][1]*(-y) + R[2][1]*z;
      const wz = R[0][2]*x + R[1][2]*(-y) + R[2][2]*z;

      let best=-9, second=-9, bi=0;
      for (let k=0;k<acts.length;k++){
        if (!acts[k].on) continue;
        const c = issues[k].center;
        const s = wx*c[0]+wy*c[1]+wz*c[2] + W[k];
        if (s > best){ second=best; best=s; bi=k; }
        else if (s > second) second=s;
      }
      const margin = best - second;
      const it = issues[bi];
      let col = cols[bi];
      let shade = 1;

      // 着陸中は他の大陸の彩度を落とす
      if (landed !== null && bi !== landed){
        const g = 0.30*col[0]+0.59*col[1]+0.11*col[2];
        col = mix(col, [g,g,g], 0.75*st.islandMix + 0.25);
        shade *= 0.72;
      }

      // 島（下位論点）
      if (hasIsl && bi === landed){
        let sb=-9, ss=-9, sj=0;
        for (let j=0;j<sub.centers.length;j++){
          const c = sub.centers[j];
          const s = wx*c[0]+wy*c[1]+wz*c[2] + sub.weights[j];
          if (s>sb){ ss=sb; sb=s; sj=j; }
          else if (s>ss) ss=s;
        }
        const item = sub.items[sj];
        col = mix(col, islCols[sj], st.islandMix);
        if (sb - ss < (0.003 + 0.004*st.islandMix)/zq) col = mix(col, [18,22,28], 0.8);  // 島の海岸線
        if (item.unread && ((px+py) % 8 < 3)) col = mix(col, [64,70,80], 0.55*st.islandMix); // 未読は斜線
      }

      // 標高＝等高線の本数（強い表現の割合）
      const rings = Math.round(it.elevation);
      const step2 = 0.020/zq;
      const band = margin / step2;
      if (band < rings && (band % 1) < 0.20) shade *= 0.82;

      // 大陸の境界
      if (margin < 0.0045/zq) col = mix(col, [13,17,23], 0.8);

      // 地表パターン（色に頼らないため）
      const p = pats[bi];
      if (p===1 && (px+py)%10 < 2) shade *= 0.955;
      else if (p===2 && px%7===0 && py%7===0) shade *= 0.90;
      else if (p===3 && (px%9===0 || py%9===0)) shade *= 0.96;

      // 陰影＋周縁減光
      const lam = Math.max(0, x*lx + (-y)*ly + z*lz);
      shade *= 0.42 + 0.58*lam;
      shade *= 0.75 + 0.25*z;

      data[o]   = Math.min(255, col[0]*shade);
      data[o+1] = Math.min(255, col[1]*shade);
      data[o+2] = Math.min(255, col[2]*shade);
      data[o+3] = 255;
    }
  }
  octx.putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(off, 0, 0, cv.width, cv.height);
  drawLabels(R, cv.width/2, cv.width/2*0.94*st.zoom);
}

// 大陸名を球の上に置く（正面を向いている大陸だけ）
function drawLabels(R, half, radius){
  const m = modeById[st.mode];
  // 画面が小さいほどキャンバスが縮小表示されるので、文字を大きくして読めるようにする
  const fs = Math.max(1, cv.width / Math.max(1, cv.clientWidth));
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  issues.forEach((it,k)=>{
    const n = m.counts[it.id];
    if (!n) return;
    const v = it.centroid;
    const a = v[0]*R[0][0]+v[1]*R[0][1]+v[2]*R[0][2];
    const b = v[0]*R[1][0]+v[1]*R[1][1]+v[2]*R[1][2];
    const z = v[0]*R[2][0]+v[1]*R[2][1]+v[2]*R[2][2];
    if (z < 0.28) return;
    const X = half + a*radius, Y = half - b*radius;
    const dim = (st.landed !== null && st.landed !== k);
    const alpha = Math.min(1,(z-0.28)/0.25) * (dim ? 0.35 : 1);
    const big = st.landed === k;
    ctx.globalAlpha = alpha;
    ctx.font = (big?"700 ":"600 ") + Math.round((big?21:17)*fs) + "px -apple-system,'Hiragino Sans',sans-serif";
    ctx.lineWidth = 4*fs; ctx.strokeStyle = "rgba(8,11,15,.85)";
    ctx.strokeText(it.label, X, Y); ctx.fillStyle = "#f2f6fa"; ctx.fillText(it.label, X, Y);
    ctx.font = "600 " + Math.round(13*fs) + "px -apple-system,'Hiragino Sans',sans-serif";
    ctx.lineWidth = 3.5*fs;
    const sub = n + "件", dy = (big?20:17)*fs;
    ctx.strokeText(sub, X, Y + dy); ctx.fillStyle = "#c7d1dc"; ctx.fillText(sub, X, Y + dy);
    ctx.globalAlpha = 1;
  });
  // 島の番号（着陸後）
  const L = st.landed;
  if (L === null || st.islandMix < 0.55) return;
  const sb = issues[L].sub;
  if (sb.status !== "reread") return;
  ctx.globalAlpha = Math.min(1,(st.islandMix-0.55)/0.35);
  ctx.lineWidth = 2*fs;
  sb.items.forEach((x,j)=>{
    const v = x.centroid;
    const a = v[0]*R[0][0]+v[1]*R[0][1]+v[2]*R[0][2];
    const b = v[0]*R[1][0]+v[1]*R[1][1]+v[2]*R[1][2];
    const z = v[0]*R[2][0]+v[1]*R[2][1]+v[2]*R[2][2];
    if (z < 0.3) return;
    const X = half + a*radius, Y = half - b*radius;
    ctx.beginPath(); ctx.arc(X, Y, 12*fs, 0, 6.284);
    ctx.fillStyle = "rgba(10,13,18,.82)"; ctx.fill();
    ctx.strokeStyle = css(islandRGB(issues[L], st.mode, j, sb.items.length, x.unread));
    ctx.stroke();
    ctx.font = "700 " + Math.round(13*fs) + "px -apple-system,sans-serif"; ctx.fillStyle = "#f2f6fa";
    ctx.fillText(String(j+1), X, Y+0.5);
  });
  ctx.globalAlpha = 1;
}

/* ---------- 当たり判定 ---------- */
function pick(mx, my){
  const half = cv.width/2, radius = half*0.94*st.zoom;
  const x = (mx - half)/radius, y = (my - half)/radius;
  if (x*x + y*y > 1) return null;
  const z = Math.sqrt(1-x*x-y*y);
  const R = rot(st.yaw, st.pitch);
  const wx = R[0][0]*x + R[1][0]*(-y) + R[2][0]*z;
  const wy = R[0][1]*x + R[1][1]*(-y) + R[2][1]*z;
  const wz = R[0][2]*x + R[1][2]*(-y) + R[2][2]*z;
  const W = D.weights_by_mode[st.mode], m = modeById[st.mode];
  let best=-9, bi=null;
  issues.forEach((it,k)=>{
    if (m.counts[it.id] <= 0) return;
    const c = it.center;
    const s = wx*c[0]+wy*c[1]+wz*c[2] + W[k];
    if (s > best){ best=s; bi=k; }
  });
  return bi;
}

/* ---------- アニメーション（案A：球を回して降りる） ---------- */
function anglesFor(v){ // その方向が正面に来る yaw/pitch
  const c = Math.max(-1, Math.min(1, v[0]));
  return { yaw: Math.asin(-c), pitch: Math.max(-0.96, Math.min(0.96, Math.atan2(v[1], v[2]))) };
}
function ease(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }

function animateTo(target, dur, done){
  if (st.anim) cancelAnimationFrame(st.anim);
  if (reduce){ Object.assign(st, target.end); st.islandMix = target.end.islandMix ?? st.islandMix; render(); done&&done(); return; }
  const from = {yaw:st.yaw, pitch:st.pitch, zoom:st.zoom, islandMix:st.islandMix};
  let dy = target.end.yaw - from.yaw;
  while (dy > Math.PI) dy -= 2*Math.PI;
  while (dy < -Math.PI) dy += 2*Math.PI;
  const t0 = performance.now();
  (function step(now){
    const t = Math.min(1, (now-t0)/dur), e = ease(t);
    st.yaw   = from.yaw + dy*e;
    st.pitch = from.pitch + (target.end.pitch-from.pitch)*e;
    // ズームは少し遅れて始める（0.25→1.0）
    const ez = ease(Math.min(1, Math.max(0,(t-0.25)/0.75)));
    st.zoom  = from.zoom + (target.end.zoom-from.zoom)*ez;
    // 島は最後に浮き上がる（0.7→1.0）
    const ei = Math.min(1, Math.max(0,(t-0.7)/0.3));
    st.islandMix = from.islandMix + ((target.end.islandMix??from.islandMix)-from.islandMix)*ei;
    render();
    if (t < 1) st.anim = requestAnimationFrame(step); else { st.anim=null; done&&done(); }
  })(t0);
}

function land(i, focus){
  st.landed = i;
  drawPanel();                                   // ← 本文はアニメを待たない（0ms）
  location.hash = issues[i].id;
  if (focus !== false){
    const h = document.querySelector("#panel h2");
    if (h){ h.tabIndex = -1; h.focus({preventScroll:true}); }
  }
  const a = anglesFor(issues[i].centroid);
  animateTo({end:{yaw:a.yaw, pitch:a.pitch, zoom:1.5, islandMix:1}}, 900);
  syncList();
}
function orbit(){
  const prev = st.landed;
  st.landed = null; drawPanel(); syncList();
  if (location.hash) history.replaceState(null,"",location.pathname);
  animateTo({end:{yaw:st.yaw, pitch:st.pitch, zoom:1, islandMix:0}}, 600, ()=>{
    const b = prev!==null && document.getElementById("btn-"+issues[prev].id);
    if (b) b.focus({preventScroll:true});
  });
}

/* ---------- パネル ---------- */
function stanceBar(counts, total){
  return '<div class="bar">' + D.stances.map(s=>{
    const n = counts[s.key]||0; if(!n) return "";
    const w = 100*n/total;
    return '<span style="width:'+w+'%;background:'+s.color+'">'+(w>13?s.label+" "+n:(w>6?n:""))+'</span>';
  }).join("") + '</div>';
}
function legend(){
  return '<div class="legend">' + D.stances.map(s=>
    '<span><i style="background:'+s.color+'"></i>'+s.label+'</span>').join("") + '</div>';
}

function drawPanel(){
  const p = document.getElementById("panel");
  const m = modeById[st.mode];
  if (st.landed === null){
    p.innerHTML = '<h2>'+D.title+'</h2>'
      + '<p class="sub">'+m.label+'：'+m.total+'件'
      + (st.mode==="all" ? '' : '（意見'+D.totals.opinions+'件のうち）')+'</p>'
      + legend()
      + '<p class="sub" style="margin:6px 0 0">大陸をクリックすると、その論点へ降ります。'
      + '大陸の大きさ＝意見の数、色＝いちばん多い立場、山の高さ＝強い表現の割合です。</p>'
      + (st.mode!=="all"
        ? '<div class="note">いま「'+m.label+'」の'+m.total+'件だけで大陸を作り直しています。'
          + '大きさはこの'+m.total+'件の中での割合です。'
          + (issues.filter(it=>m.counts[it.id]===0).length
             ? '<br>この立場では '+issues.filter(it=>m.counts[it.id]===0).map(it=>it.label).join("・")
               +' が0件のため、大陸が消えています。'
             : '')
          + '</div>'
        : '');
    return;
  }
  const it = issues[st.landed];
  const n = m.counts[it.id];
  let h = '<h2>'+it.icon+' '+it.label+'</h2>'
    + '<p class="sub">'+n+'件 / '+m.label+m.total+'件中 '+(100*n/m.total).toFixed(1)+'%'
    + '　山の高さ：強い表現'+it.high_adjusted_pct+'%</p>'
    + legend() + stanceBar(it.stances, it.count)
    + '<p class="sub" style="margin:2px 0 0">立場の内訳は全'+it.count+'件で数えています</p>';
  if (it.share_pct < D.min_area_pct){
    h += '<div class="note">この大陸は実際の割合（'+it.share_pct+'%）より大きく描いています。'
       + '小さすぎると押せないため、最小'+D.min_area_pct+'%まで拡大しました。実件数は'+it.count+'件です。</div>';
  }
  const s = it.sub;
  if (s.status === "reread"){
    h += '<p class="sub" style="margin-top:12px"><b>この論点の中身（編集部が本文を読んで分けたもの）</b></p>'
      + '<ul class="islands">' + s.items.map((x,j)=>
          '<li class="'+(x.unread?"unread":"")+'">'
          + '<span class="num">'+(j+1)+'</span>'
          + '<span class="sw" style="background:'+css(islandRGB(it, st.mode, j, s.items.length, x.unread))+'"></span>'
          + x.label + '<span class="n">'+x.count+'件</span></li>').join("") + '</ul>'
      + '<div class="note">'+s.coverage_note+'。読み直した'+s.reread_count+'件は '
      + '<code>'+s.source_file.split("/").pop()+'</code> が出所です。'
      + (s.unread_count ? '残り'+s.unread_count+'件は、その後に増えた分でまだ読めていません。' : '')
      + '</div>';
  } else {
    h += '<div class="note">'+s.note+'。<br>'
       + 'AIが自動でつけた区分をここに並べることはしません。人が読んだ結果だけを島にします。</div>';
  }
  // 資料との照合と海面下への導線は、生成器が作った静的HTMLを読んで使う。
  // ここでもう一度組み立てると、同じ数字と文言が2通りに分かれる。
  const extras = document.getElementById("extras-" + it.id);
  if (extras) h += extras.innerHTML;
  h += '<button class="back" id="back" type="button">← 惑星全体へ戻る（Esc）</button>';
  p.innerHTML = h;
  document.getElementById("back").onclick = orbit;
}

/* ---------- 一覧・モード ---------- */
function syncList(){
  const m = modeById[st.mode];
  issues.forEach((it,i)=>{
    const b = document.getElementById("btn-"+it.id);
    if (!b) return;
    const n = m.counts[it.id];
    b.setAttribute("aria-pressed", st.landed===i ? "true":"false");
    b.style.opacity = n ? 1 : .45;
    b.querySelector(".m").textContent =
      (n ? n+"件・"+(100*n/m.total).toFixed(1)+"%" : "この立場では0件")
      + "／" + (it.sub.status==="reread" ? "島"+it.sub.items.length : "未再読");
  });
}
function buildList(){
  const ul = document.getElementById("list");
  ul.innerHTML = issues.map(it =>
    '<li><button type="button" id="btn-'+it.id+'" aria-pressed="false">'
    + '<span class="dot" style="background:'+stanceMap[it.top_stance].color+'"></span>'
    + it.icon+' '+it.label+'<span class="m"></span></button></li>').join("");
  issues.forEach((it,i)=>{ document.getElementById("btn-"+it.id).onclick = ()=>land(i); });
}
function buildModes(){
  const el = document.getElementById("modes");
  el.innerHTML = D.modes.map(m =>
    '<button type="button" data-m="'+m.id+'" aria-pressed="'+(m.id==="all")+'">'
    + m.label+' '+m.total+'</button>').join("");
  el.querySelectorAll("button").forEach(b => b.onclick = ()=>{
    st.mode = b.dataset.m;
    el.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", x===b));
    if (st.landed!==null && modeById[st.mode].counts[issues[st.landed].id]===0) st.landed=null;
    drawPanel(); syncList(); render();
  });
}

/* ---------- 操作 ---------- */
let px0=0, py0=0, moved=0;
function pos(e){
  const r = cv.getBoundingClientRect(), t = e.touches ? e.touches[0] : e;
  return [(t.clientX-r.left)*cv.width/r.width, (t.clientY-r.top)*cv.height/r.height];
}
cv.addEventListener("pointerdown", e=>{
  cv.setPointerCapture(e.pointerId); st.dragging=true; moved=0;
  cv.classList.add("dragging"); [px0,py0]=pos(e);
});
cv.addEventListener("pointermove", e=>{
  if (!st.dragging) return;
  const [x,y]=pos(e), dx=x-px0, dy=y-py0;
  moved += Math.abs(dx)+Math.abs(dy);
  st.yaw += dx*0.006;
  st.pitch = Math.max(-0.96, Math.min(0.96, st.pitch + dy*0.006));  // 上下55度で制限
  px0=x; py0=y; render();
});
function endDrag(e){
  if (!st.dragging) return;
  st.dragging=false; cv.classList.remove("dragging");
  if (moved < 6){ const i = pick(...pos(e)); if (i!==null) land(i); }
  render();
}
cv.addEventListener("pointerup", endDrag);
cv.addEventListener("pointercancel", ()=>{ st.dragging=false; cv.classList.remove("dragging"); render(); });
cv.addEventListener("wheel", e=>{
  e.preventDefault();
  st.zoom = Math.max(1, Math.min(2.6, st.zoom * (e.deltaY>0?0.94:1.06))); render();
}, {passive:false});
document.getElementById("zin").onclick = ()=>{ st.zoom=Math.min(2.6,st.zoom*1.15); render(); };
document.getElementById("zout").onclick= ()=>{ st.zoom=Math.max(1,st.zoom/1.15); render(); };
addEventListener("keydown", e=>{
  if (e.key === "Escape" && st.landed!==null){ orbit(); return; }
  if (document.activeElement !== cv) return;
  if (e.key==="ArrowLeft"){ st.yaw-=0.12; render(); e.preventDefault(); }
  if (e.key==="ArrowRight"){ st.yaw+=0.12; render(); e.preventDefault(); }
  if (e.key==="ArrowUp"){ st.pitch=Math.max(-0.96,st.pitch-0.1); render(); e.preventDefault(); }
  if (e.key==="ArrowDown"){ st.pitch=Math.min(0.96,st.pitch+0.1); render(); e.preventDefault(); }
});

/* ---------- 初期化 ---------- */
/* 中心の問い・注意書き・見かたは生成器が静的HTMLとして書き込む。
   JSが動かなくても読めるようにするためで、ここで書き直すと出所が2つになる。 */
try {
  (function initView(){ const a = anglesFor(issues[0].centroid); st.yaw=a.yaw; st.pitch=a.pitch; })();
  buildModes(); buildList(); drawPanel(); syncList(); render();
  const h = location.hash.slice(1);
  if (h && idIndex[h] !== undefined) land(idIndex[h], false);
} catch (e) {
  /* 描けなかったときは静的表示へ戻す（空の惑星を見せない） */
  document.documentElement.className =
    document.documentElement.className.replace(/\bplanet-live\b/, "");
  throw e;
}
})();
</script>
