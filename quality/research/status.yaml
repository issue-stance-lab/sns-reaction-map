    note: "2026-09-07に全面的に取り直し、厚くなった。文科省5/22見解の本体・4/7通知本文・国交省5/22告発（海上運送法違反）・玉城知事の記者会見録（4/10と5/29）・国会会議録26会議60発言を取得し原文照合。前版の誤り1件（4/7通知に政治的中立性の言及なし→実際は第3節にある）を訂正。全6論点に一次資料がついた（報道論点はNHK副会長の国会答弁）。残る未確認は(1)運輸安全委員会の事故調査報告書＝9/7時点で「調査中」で未公表、(2)文科省6/26フォローアップ調査の結果＝7月末回答期限で公表待ち、(3)学校法人の特別調査委員会報告＝民間のため採否はオーナー判断。review_days:30 は(1)(2)の公表待ちがあるため維持"
