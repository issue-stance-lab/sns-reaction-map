# scripts/admin_dashboard/collect.py の collect_primary_research() が読む。
# 手順は .claude/skills/primary-research/SKILL.md（main側）を参照。
#
# last_verified: そのテーマの一次資料メモを最後に実際に確認・照合した日
# review_days: 個別の再確認サイクル（省略時は default_review_days）

default_review_days: 90

themes:
  ai-copyright:
    last_verified: "2026-09-07"
    note: "2026-09-07に取り直した。文化庁「AIと著作権に関する考え方」本体・著作権法30条の4/47条の5の条文本文（e-Gov API）・知的財産推進計画2026・プリンシプル・コードまで照合済み。重要：令和8年法律第48号の著作権法改正は実演家の二次使用料の話で、AI関連条文は変わっていない（混同注意）。残る未確認は(1)経産省ドメインが403で取れない（AI事業者ガイドラインは総務省側に同一文書あり）(2)AI生成物の確定判例は無いと見られる(3)プリンシプル・コードの届出開始時期が未定"
  bike-blue-ticket:
    last_verified: "2026-09-07"
    note: "厚い。2026-09-07に道路交通法施行令 別表第六（反則金の額）を条文で確認。自転車は「原付等」欄で読む（信号無視6,000円・一時不停止5,000円・自転車道通行義務違反3,000円）。「違反113種類」の数え方の根拠だけ未特定"
  bukatsu-chiiki:
    last_verified: "2026-09-07"
    note: "厚い。MEXTガイドブック・東京都指導員募集・中体連規則まで確認済み。2026-09-07に第7節（学習指導要領・資料M〜Q）と第8節（法的根拠・認定制度・資料R/S）の本文照合を完了。未解決リストは4と6が解消、5が前進。さらに第1〜6節の「推定」記述7件も解消し誤り3件を訂正、第9節「事故が起きたときの補償」も新設した（全9節が本文照合済み）。次は(1)中教審答申（令和8年冬頃予定）で資料P・Qを再確認、(2)次回の教員勤務実態調査で資料G-2を更新、(3)文化部側と給特法令和7年改正。未解決リストは8項目すべて解消済み（残るのは各項目内の細目のみ）"
  constitutional-amendment:
    last_verified: "2026-09-07"
    note: "2026-09-07に見直した。前版の「確認できなかったこと」4項目はすべて解消済みだったのにリストが古いままだったので書き換えた。国民投票法の条文本文（60〜180日・投票総数の2分の1超・最低投票率なし）と自民党の2026年版説明資料を追加。残るのは立憲・維新・公明・共産の党公式文書（未取得）"
