# scripts/admin_dashboard/collect.py の collect_primary_research() が読む。
# 手順は .claude/skills/primary-research/SKILL.md（main側）を参照。
#
# last_verified: そのテーマの一次資料メモを最後に実際に確認・照合した日
# review_days: 個別の再確認サイクル（省略時は default_review_days）

default_review_days: 90

themes:
  ai-copyright:
    last_verified: "2026-09-07"
    note: "2026-09-07に取り直した。文化庁「AIと著作権に関する考え方」本体・著作権法30条の4/47条の5の条文本文（e-Gov API）・知的財産推進計画2026・プリンシプル・コードまで照合済み。重要：令和8年法律第48号の著作権法改正は実演家の二次使用料の話で、AI関連条文は変わっていない（混同注意）。残る未確認は(1)経産省ドメインが403で取れない（AI事業者ガイドラインは総務省側に同一文書あり）(2)AI生成物の確定判例は無いと見られる(3)プリンシプル・コードの届出開始時期が未定"
  bike-blue-ticket:
    last_verified: "2026-09-07"
    note: "厚い。2026-09-07に道路交通法施行令 別表第六（反則金の額）を条文で確認。自転車は「原付等」欄で読む（信号無視6,000円・一時不停止5,000円・自転車道通行義務違反3,000円）。「違反113種類」の数え方の根拠だけ未特定"
  bukatsu-chiiki:
    last_verified: "2026-09-23"
    note: "厚い。MEXTガイドブック・東京都指導員募集・中体連規則まで確認済み。2026-09-07に第7節（学習指導要領・資料M〜Q）と第8節（法的根拠・認定制度・資料R/S）の本文照合を完了。第9節「事故が起きたときの補償」も新設した。2026-09-23に自治体別の計画・方針カタログを新設し、京都市・神戸市・板橋区・名古屋市・大阪市・札幌市の公式資料を追加。次は(1)中教審答申（令和8年冬頃予定）で資料P・Qを再確認、(2)次回の教員勤務実態調査で資料G-2を更新、(3)文化部側と給特法令和7年改正、(4)自治体別カタログの全国拡張。"
  constitutional-amendment:
    last_verified: "2026-09-13"
    note: "背景・経緯に使用する範囲を原典再確認。戦後の起点・国会調査会・国民投票制度・2026年5月議論用資料と7月法律成立を追加。全資料一括再監査ではない。全党の最新公式文書の横断比較は未完了"
  fukushuto:
    last_verified: "2026-09-07"
    note: "厚い。2026-09-07に副首都法（令和8年法律第78号・全35条）の条文本文をe-Govで取得。施行は2026-10-30で確定、推進本部は法定組織、指定対象は「道府県」。施行後に本部設置と指定手続を確認する"
  consumption-tax-cut:
    last_verified: "2026-09-17"
    review_days: 30
    note: "2026-09-17に、2026-09-15閣議決定の「飲食料品消費税率の臨時的な引下げ及び就業者負担軽減支援金の導入に関する大綱」（内閣官房、本文16頁+概要3頁）を本文照合して反映（資料N/O/P）。税率1%（国税0.78%+地方0.22%、令和9年4月1日〜令和11年3月31日）、就業者負担軽減支援金の受給要件・支給設計・費用負担割合、総額表示・簡易課税等の事業者向け経過措置まで確定。「給付と減税の比較」の空白がほぼ解消。残るのは(1)減税効果の政府試算（物価・GDP）は本大綱には無い、(2)臨時国会への法律案提出・審議の動向。review_days:30は法案提出が秋（時期未定・近い見込み）のため短縮"
  elderly-license-revocation:
    last_verified: "2026-09-07"
    note: "厚い。2026-09-07に警察庁『運転免許統計 令和7年版』本体から自主返納件数の年別推移を取得（令和元年60.1万件がピーク→令和5年38.3万件→令和7年43.5万件で増加に転じる。65歳以上が95%）。残るのは自治体の支援制度一覧と政党公約"
