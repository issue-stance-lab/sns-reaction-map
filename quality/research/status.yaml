    last_verified: "2026-09-13"
    review_days: 30
    note: "2026-09-07に取り直し、厚くなった。最大の空白だった改正法（令和8年法律第66号）の条文本文を、e-Gov法令APIにリビジョンIDを渡して未施行版として取得（law_data/322AC0000000003_20261024_508AC0000000066）。第12・13条削除＝女性皇族の皇籍維持、第38条新設＝旧宮家男系男子の養子、養子本人は皇位継承資格なし・その子は有り（官房長官答弁で確認）。令和3年の政府有識者会議報告・宮内庁の皇族数・賛否両論の討論も取得。施行日は2026-10-24で確定。残るのは(1)衆議院側の審議本文(2)政府が女系天皇の可否を正面から述べた答弁は今回も特定できず（政府の立場は「立法府の総意に従った」）(3)10/24の施行後に現行版が切り替わったことの確認"
