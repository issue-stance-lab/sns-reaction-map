<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=800,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--page:#07111E;--c1:#0C1E35;--c2:#0A1928;--c3:#071522;--ink:#F0F4FF;--i70:rgba(240,244,255,.70);--i45:rgba(240,244,255,.45);--teal:#2DD4BF;--amber:#FBBF24}*{box-sizing:border-box}html,body,.canvas{width:800px;height:1230px;margin:0;overflow:hidden}body{background:var(--page);color:var(--ink);font-family:'Noto Sans JP',sans-serif;font-variant-numeric:tabular-nums}.canvas{position:relative;padding:36px 40px;background:radial-gradient(circle at 86% 5%,rgba(45,212,191,.12),transparent 28%),linear-gradient(145deg,var(--c1),var(--c2) 60%,var(--c3));border:1px solid rgba(255,255,255,.08);border-radius:16px}.canvas:before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:48px 48px}.content{position:relative;z-index:1}h1{margin:0;font-size:44px;line-height:1.27}.sub{margin:10px 0 17px;color:var(--i70);font-size:26px;line-height:1.4}.chart{position:relative}.row{margin-bottom:10px}.label{margin-bottom:8px;font-size:30px;font-weight:500;line-height:1.25}.barline{display:flex;align-items:center;gap:14px}.bar{height:56px;border-radius:0 6px 6px 0}.v{font-size:48px;font-weight:900;line-height:1;white-space:nowrap;color:var(--i70)}.primary{color:var(--teal)}.a{width:444px;background:var(--teal)}.b{width:252px;background:rgba(45,212,191,.62)}.c{width:296px;background:rgba(45,212,191,.70)}.d{width:118px;background:rgba(45,212,191,.40)}.e{width:118px;background:rgba(45,212,191,.40)}.f{width:59px;background:rgba(45,212,191,.28)}.callout{display:flex;align-items:center;gap:18px;margin:8px 0 14px;padding:13px 0 13px 18px;border-left:2px solid var(--amber);border-top:2px solid var(--amber);border-bottom:2px solid var(--amber)}.callout b{color:var(--amber);font-size:44px;font-weight:900;line-height:1.15}.callout span{color:var(--i70);font-size:26px;line-height:1.3}.axis{display:flex;justify-content:space-between;width:444px;margin-top:-2px;color:var(--i45);font-size:24px}.notes{margin:10px 0 56px;color:var(--i45);font-size:24px;line-height:1.4}.credit{position:absolute;z-index:1;right:28px;bottom:20px;color:var(--i45);font-size:24px;letter-spacing:.08em}
</style></head><body><main class="canvas"><div class="content"><h1>賛成しなかった投稿を、<br>言っている中身で分け直した</h1><p class="sub">編集部が87件すべての本文を読んで分類しました</p><section class="chart"><div class="row"><div class="label">直すべきは制度と待遇</div><div class="barline"><div class="bar a"></div><b class="v primary">30件</b></div></div><div class="row"><div class="label">移しても負担は減らない</div><div class="barline"><div class="bar b"></div><b class="v">17件</b></div></div><div class="callout"><b>合わせて47件</b><span>87件の半分以上</span></div><div class="row"><div class="label">その他（分類が難しいもの）</div><div class="barline"><div class="bar c"></div><b class="v">20件</b></div></div><div class="row"><div class="label">やりたい先生だけが担う</div><div class="barline"><div class="bar d"></div><b class="v">8件</b></div></div><div class="row"><div class="label">失われるものへの不安</div><div class="barline"><div class="bar e"></div><b class="v">8件</b></div></div><div class="row"><div class="label">部活そのものを廃止すべき</div><div class="barline"><div class="bar f"></div><b class="v">4件</b></div></div><div class="axis"><span>0</span><span>30件</span></div></section><p class="notes">※編集部が87件すべての本文を読んで分類しました。キーワード抽出は使っていません<br>※「その他」は内容で分類できなかった区分のため、件数の順にかかわらず下に置いています</p></div><div class="credit">SNS反応まっぷ</div></main></body></html>
