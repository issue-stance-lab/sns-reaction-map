<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=800,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--page:#07111E;--c1:#0C1E35;--c2:#0A1928;--c3:#071522;--ink:#F0F4FF;--i70:rgba(240,244,255,.70);--i45:rgba(240,244,255,.45);--teal:#2DD4BF;--red:#F87171;--amber:#FBBF24;--gray:#64748B}*{box-sizing:border-box}html,body,.canvas{width:800px;height:420px;margin:0;overflow:hidden}body{background:var(--page);color:var(--ink);font-family:'Noto Sans JP',sans-serif;font-variant-numeric:tabular-nums}.canvas{position:relative;padding:38px 40px;background:radial-gradient(circle at 86% 5%,rgba(45,212,191,.12),transparent 28%),linear-gradient(145deg,var(--c1),var(--c2) 60%,var(--c3));border:1px solid rgba(255,255,255,.08);border-radius:16px}.canvas:before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:48px 48px}h1,.bar,.legend{position:relative;z-index:1}h1{margin:0;font-size:44px;line-height:1.25}.bar{display:flex;gap:2px;height:90px;margin-top:28px;background:rgba(7,17,30,.72);border-radius:10px;overflow:hidden}.seg{display:flex;align-items:center;justify-content:center;color:#07111E;font-size:34px;font-weight:900}.a{flex:136;background:var(--teal)}.b{flex:44;background:var(--red)}.c{flex:43;background:var(--amber)}.d{flex:4;background:var(--gray)}.legend{display:grid;grid-template-columns:380px 1fr;gap:14px 12px;margin-top:28px;color:var(--i70);font-size:30px;font-weight:500;line-height:1.15}.item{display:flex;align-items:center;gap:10px;white-space:nowrap}.dot{width:16px;height:16px;border-radius:4px;flex:none}.item b{color:var(--ink);font-weight:700}.credit{position:absolute;z-index:1;right:28px;bottom:20px;color:var(--i45);font-size:24px;letter-spacing:.08em}
</style></head><body><main class="canvas"><h1>先生の負担を語る227件の内訳</h1><div class="bar"><div class="seg a">136件</div><div class="seg b">44件</div><div class="seg c">43件</div><div class="seg d"></div></div><div class="legend"><div class="item"><i class="dot" style="background:var(--teal)"></i>移行支持 <b>136件</b></div><div class="item"><i class="dot" style="background:var(--red)"></i>慎重・反対 <b>44件</b></div><div class="item"><i class="dot" style="background:var(--amber)"></i>条件付き・改善要求 <b>43件</b></div><div class="item"><i class="dot" style="background:var(--gray)"></i>中立・情報 <b>4件</b></div></div><div class="credit">SNS反応まっぷ</div></main></body></html>
