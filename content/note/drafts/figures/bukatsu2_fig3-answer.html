<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=800,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--page:#07111E;--c1:#0C1E35;--c2:#0A1928;--c3:#071522;--ink:#F0F4FF;--i70:rgba(240,244,255,.70);--i45:rgba(240,244,255,.45);--red:#F87171;--amber:#FBBF24;--gray:#64748B}*{box-sizing:border-box}html,body,.canvas{width:800px;height:1100px;margin:0;overflow:hidden}body{background:var(--page);color:var(--ink);font-family:'Noto Sans JP',sans-serif;font-variant-numeric:tabular-nums}.canvas{position:relative;padding:38px 40px;background:radial-gradient(circle at 86% 5%,rgba(45,212,191,.12),transparent 28%),linear-gradient(145deg,var(--c1),var(--c2) 60%,var(--c3));border:1px solid rgba(255,255,255,.08);border-radius:16px}.canvas:before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:48px 48px}.content{position:relative;z-index:1}h1{margin:0 0 20px;font-size:44px;line-height:1.3}.item{padding:24px 0 26px;border-top:1px solid rgba(255,255,255,.08)}.worry{font-size:30px;font-weight:700;line-height:1.35}.count{margin-left:10px;color:var(--i45);font-size:26px;font-weight:400}.evidence{margin-top:12px;color:var(--i70);font-size:30px;line-height:1.45}.result{margin-top:13px;font-size:44px;font-weight:900;line-height:1.15}.hit{color:var(--red)}.partial{color:var(--amber)}.open{color:var(--gray)}.source{margin-top:8px;color:var(--i45);font-size:24px;line-height:1.35}.credit{position:absolute;z-index:1;right:28px;bottom:20px;color:var(--i45);font-size:24px;letter-spacing:.08em}
</style></head><body><main class="canvas"><div class="content"><h1>87件の指摘と、資料の答え合わせ</h1><article class="item"><div class="worry">心配　移しても先生は出続ける<span class="count">17件</span></div><div class="evidence">国は兼職兼業を「積極的に許可」。<br>神栖市も教職員の指導者を明記</div><div class="result hit">当たっていた</div><div class="source">出典：文科省ガイドライン／神栖市Q&amp;A</div></article><article class="item"><div class="worry">心配　先生の時間に値段がついていない<span class="count">30件</span></div><div class="evidence">神栖市は1時間1,700円。許可の条件は<br>単月100時間、複数月平均80時間まで</div><div class="result partial">半分だけ答えが出た</div><div class="source">出典：神栖市Q&amp;A／厚労省 労災認定基準</div></article><article class="item"><div class="worry">心配　指導者は集まるのか</div><div class="evidence">国も、十分な指導者の確保は<br>不可欠な課題だと挙げている</div><div class="result open">未解決</div><div class="source">出典：文科省ガイドライン</div></article></div><div class="credit">SNS反応まっぷ</div></main></body></html>
