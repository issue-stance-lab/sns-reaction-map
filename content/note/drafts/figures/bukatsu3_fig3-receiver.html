</style></head><body><main class="canvas" aria-label="受け皿・指導者を語る100件の内訳"><h1>受け皿・指導者を語る100件の内訳</h1><p class="lead">編集部が100件すべての本文を読んで分類しました</p><section class="plot" aria-label="横棒グラフ"><div class="row"><div class="label">引き受け手がいない</div><div class="bar"><div class="fill teal" style="width:310px"></div></div><div class="count">23件</div></div><div class="row"><div class="label">報酬が安く人が来ない</div><div class="bar"><div class="fill teal" style="width:270px"></div></div><div class="count">20件</div></div><div class="row"><div class="label">責任・安全・質への不安</div><div class="bar"><div class="fill ink70" style="width:229px"></div></div><div class="count">17件</div></div><div class="row"><div class="label">うまくいっている</div><div class="bar"><div class="fill amber" style="width:216px"></div></div><div class="count">16件</div></div><div class="row"><div class="label">その他</div><div class="bar"><div class="fill gray" style="width:297px"></div></div><div class="count">22件</div></div><div class="row"><div class="label">送迎・移動の課題</div><div class="bar"><div class="fill gray" style="width:27px"></div></div><div class="count">2件</div></div><div class="bracket" aria-hidden="true"></div><div class="callout"><strong>合わせて43件</strong><span>100件の半分近く</span></div><div class="axis"><span class="zero">0</span><span class="max">23</span><span class="unit">件</span></div></section><div class="foot">※編集部が100件すべての本文を読んで分類しました。キーワード抽出は使っていません</div><div class="credit">SNS反応まっぷ</div></main></body></html>
