<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root{--page:#07111E;--ink:#F0F4FF;--ink-70:rgba(240,244,255,.70);--ink-45:rgba(240,244,255,.45);--teal:#2DD4BF}
    *{box-sizing:border-box}
    html,body,.canvas{width:1280px;height:670px;margin:0;overflow:hidden}
    body{background:var(--page);font-family:'Noto Sans JP',sans-serif;font-variant-numeric:tabular-nums}
    .canvas{position:relative;background:var(--page);border:1px solid rgba(255,255,255,.08);border-radius:16px}
    .photo,.gradient,.shade{position:absolute;inset:0;width:100%;height:100%}
    .photo{object-fit:cover;object-position:center}
    .gradient{background:linear-gradient(90deg,rgba(7,17,30,.94) 0%,rgba(7,17,30,.86) 42%,rgba(7,17,30,.15) 72%,rgba(7,17,30,0) 100%)}
    .shade{background:rgba(7,17,30,.25)}
    .content{position:absolute;z-index:1;left:315px;top:158px;width:620px;color:var(--ink)}
    .eyebrow{margin:0 0 15px;color:var(--ink-70);font-size:34px;font-weight:500;letter-spacing:.08em;line-height:1.35}
    .price{display:flex;align-items:baseline;height:166px;font-weight:900;line-height:.95;letter-spacing:-.045em;white-space:nowrap}
    .number{color:var(--teal);font-size:150px}
    .unit{margin-left:8px;color:var(--ink-70);font-size:90px;font-weight:700;letter-spacing:-.02em}
    .subtitle{margin:18px 0 0;color:var(--ink-45);font-size:28px;font-weight:400;line-height:1.45}
    .credit{position:absolute;z-index:1;right:28px;bottom:20px;color:var(--ink-70);font-size:12px;letter-spacing:.08em}
  </style>
</head>
<body>
  <main class="canvas" aria-label="部活動の地域移行、お金と送迎編">
    <img class="photo" src="../photos/parent-pickup-dusk.png" alt="夕方の地域スポーツ施設の外で送迎を待つ保護者">
    <div class="gradient"></div><div class="shade"></div>
    <div class="content">
      <p class="eyebrow">部活動の地域移行 ③お金と送迎編</p>
      <div class="price"><span class="number">25,000</span><span class="unit">円</span></div>
      <p class="subtitle">地域クラブの年会費は、<br>部活動の平均より安かった</p>
    </div>
    <div class="credit">SNS反応まっぷ</div>
  </main>
</body>
</html>
