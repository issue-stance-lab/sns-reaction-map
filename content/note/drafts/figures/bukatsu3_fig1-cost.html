<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=800,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root{--page:#07111E;--card-1:#0C1E35;--card-2:#0A1928;--card-3:#071522;--ink:#F0F4FF;--ink-70:rgba(240,244,255,.70);--ink-45:rgba(240,244,255,.45);--teal:#2DD4BF;--amber:#FBBF24;--gray:#64748B}
    *{box-sizing:border-box}html,body,.canvas{width:800px;height:940px;margin:0;overflow:hidden}body{font-family:'Noto Sans JP',sans-serif;font-variant-numeric:tabular-nums;background:var(--page);color:var(--ink)}
    .canvas{position:relative;padding:32px 32px 0;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:radial-gradient(circle at 88% 8%,rgba(45,212,191,.12),transparent 30%),repeating-linear-gradient(0deg,transparent 0 47px,rgba(255,255,255,.025) 47px 48px),repeating-linear-gradient(90deg,transparent 0 47px,rgba(255,255,255,.025) 47px 48px),linear-gradient(145deg,var(--card-1) 0%,var(--card-2) 60%,var(--card-3) 100%)}
    h1{margin:0;font-size:44px;line-height:1.25;font-weight:700;letter-spacing:-.035em}.lead{margin:12px 0 28px;font-size:26px;line-height:1.3;color:var(--ink-70)}
    .plot{position:relative}.row{position:relative;height:84px;margin-bottom:24px}.row:last-of-type{margin-bottom:0}.label{height:36px;font-size:30px;line-height:1.2;font-weight:500;letter-spacing:-.035em;white-space:nowrap}.bar{position:absolute;left:0;top:36px;width:310px;height:48px;background:rgba(255,255,255,.06)}.fill{height:48px;border-radius:0 4px 4px 0}.teal{background:var(--teal)}.amber{background:var(--amber)}.ink70{background:var(--ink-70)}.gray{background:var(--gray)}.count{position:absolute;left:326px;top:34px;font-size:44px;line-height:1.1;font-weight:900;letter-spacing:-.04em;white-space:nowrap}
    .bracket{position:absolute;left:435px;top:138px;width:18px;height:150px;border-left:3px solid var(--amber)}.bracket::before,.bracket::after{content:'';position:absolute;left:0;width:17px;height:3px;background:var(--amber)}.bracket::before{top:0}.bracket::after{bottom:0}.callout{position:absolute;left:470px;top:169px;width:265px}.callout strong{display:block;color:var(--amber);font-size:40px;line-height:1.08;font-weight:900;letter-spacing:-.06em;white-space:nowrap}.callout span{display:block;margin-top:10px;color:var(--ink-70);font-size:24px;line-height:1.4}
    .axis{position:absolute;left:0;top:632px;width:310px;height:30px;border-top:1px solid rgba(255,255,255,.06);font-size:24px;color:var(--ink-45);line-height:1}.axis::after{content:'';position:absolute;right:0;top:-1px;height:7px;border-right:1px solid rgba(255,255,255,.06)}.zero{position:absolute;top:7px;left:0}.max{position:absolute;top:7px;right:0}.unit{position:absolute;top:7px;right:-34px}.foot{position:absolute;left:32px;bottom:26px;width:530px;font-size:24px;line-height:1.25;color:var(--ink-45);letter-spacing:-.035em}.credit{position:absolute;right:28px;bottom:28px;font-size:24px;color:var(--ink-45);letter-spacing:.08em}
  </style>
</head>
<body>
  <main class="canvas" aria-label="費用・家庭負担を語る72件の内訳">
    <h1>費用・家庭負担を語る72件の内訳</h1><p class="lead">編集部が72件すべての本文を読んで分類しました</p>
    <section class="plot" aria-label="横棒グラフ">
      <div class="row"><div class="label">誰が、いくら払うか決めろ</div><div class="bar"><div class="fill teal" style="width:310px"></div></div><div class="count">21件</div></div>
      <div class="row"><div class="label">お金で参加できない子が出る</div><div class="bar"><div class="fill amber" style="width:192px"></div></div><div class="count">13件</div></div>
      <div class="row"><div class="label">家庭が払えない・負担増</div><div class="bar"><div class="fill amber" style="width:118px"></div></div><div class="count">8件</div></div>
      <div class="row"><div class="label">安いのは誰かの無償労働</div><div class="bar"><div class="fill ink70" style="width:229px"></div></div><div class="count">15件</div></div>
      <div class="row"><div class="label">送迎・移動の負担</div><div class="bar"><div class="fill gray" style="width:133px"></div></div><div class="count">9件</div></div>
      <div class="row"><div class="label">その他</div><div class="bar"><div class="fill gray" style="width:89px"></div></div><div class="count">6件</div></div>
      <div class="bracket" aria-hidden="true"></div><div class="callout"><strong>合わせて21件</strong><span>財源設計を求める声（1段目）と同じ数</span></div>
      <div class="axis"><span class="zero">0</span><span class="max">21</span><span class="unit">件</span></div>
    </section>
    <div class="foot">※編集部が72件すべての本文を読んで分類しました。キーワード抽出は使っていません</div><div class="credit">SNS反応まっぷ</div>
  </main>
</body>
</html>
