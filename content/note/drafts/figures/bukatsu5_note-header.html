<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root{--page:#07111E;--ink:#F0F4FF;--ink-70:rgba(240,244,255,.70);--ink-45:rgba(240,244,255,.45);--teal:#2DD4BF}
    *{box-sizing:border-box} html,body,.canvas{width:1280px;height:670px;margin:0;overflow:hidden}
    body{background:var(--page);font-family:'Noto Sans JP',sans-serif;font-variant-numeric:tabular-nums}
    .canvas{position:relative;background:var(--page);border:1px solid rgba(255,255,255,.08);border-radius:16px}
    .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .veil{position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,17,30,.94) 0%,rgba(7,17,30,.86) 42%,rgba(7,17,30,.15) 72%,rgba(7,17,30,0) 100%)}
    .content{position:absolute;z-index:1;left:72px;top:82px;width:570px;color:var(--ink)}
    .eyebrow{margin:0 0 20px;color:var(--ink-70);font-size:28px;font-weight:500;letter-spacing:.06em;line-height:1.35}
    h1{margin:0;font-size:64px;line-height:1.16;font-weight:900;letter-spacing:-.06em}
    .answer{margin:22px 0 0;color:var(--teal);font-size:48px;line-height:1.12;font-weight:900;letter-spacing:-.05em}
    .credit{position:absolute;z-index:1;right:28px;bottom:20px;color:var(--ink-45);font-size:20px;letter-spacing:.08em}
  </style>
</head>
<body>
  <main class="canvas" aria-label="部活動は、学習指導要領から消えるのか。消えません">
    <img class="photo" src="../photos/teacher-reading-booklet.png" alt="職員室で冊子を読む教員">
    <div class="veil"></div>
    <section class="content">
      <p class="eyebrow">部活動の地域移行を読む 第5回</p>
      <h1>部活動は、<br>学習指導要領から<br>消えるのか</h1>
      <p class="answer">消えません</p>
    </section>
    <div class="credit">SNS反応まっぷ</div>
  </main>
</body>
</html>
