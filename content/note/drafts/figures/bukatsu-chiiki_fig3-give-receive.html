<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <title>渡す側と受け取る側</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --page: #07111E;
      --ink: #F0F4FF;
      --ink-70: rgba(240,244,255,0.70);
      --ink-45: rgba(240,244,255,0.45);
      --teal: #2DD4BF;
      --red: #F87171;
      --amber: #FBBF24;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 680px; overflow: hidden; }
    body {
      background: var(--page);
      color: var(--ink);
      font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif;
      font-variant-numeric: tabular-nums;
    }
    .canvas {
      position: relative;
      width: 1200px;
      height: 680px;
      padding: 38px 52px 40px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      background: #07111E;
    }
    .canvas::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }
    h1 {
      position: relative;
      z-index: 1;
      margin: 0;
      color: var(--ink);
      font-size: 28px;
      font-weight: 700;
      line-height: 1.4;
    }
    .panels {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 156px;
      margin-top: 26px;
    }
    .panel {
      position: relative;
      width: 470px;
      height: 540px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
    }
    .panel::before {
      content: '';
      position: absolute;
      z-index: 3;
      top: 0;
      bottom: 0;
      left: 0;
      width: 3px;
    }
    .give::before { background: var(--teal); }
    .receive::before { background: var(--red); }
    .photo {
      position: absolute;
      inset: 0 0 auto 0;
      width: 100%;
      height: 250px;
      object-fit: cover;
    }
    .give .photo { object-position: center 38%; }
    .receive .photo { object-position: center 42%; }
    .photo-shade {
      position: absolute;
      z-index: 1;
      inset: 0 0 auto 0;
      height: 330px;
      background: linear-gradient(180deg, rgba(7,17,30,0.02) 18%, rgba(7,17,30,0.72) 65%, rgba(7,17,30,0.97) 100%);
    }
    .panel-content {
      position: absolute;
      z-index: 2;
      right: 28px;
      bottom: 28px;
      left: 30px;
    }
    .kicker {
      margin: 0 0 8px;
      color: var(--ink-45);
      font-size: 18px;
      font-weight: 500;
      letter-spacing: .1em;
      line-height: 1.35;
    }
    h2 {
      margin: 0;
      color: var(--ink);
      font-size: 27px;
      font-weight: 700;
      line-height: 1.35;
    }
    .stat {
      margin-top: 10px;
      font-size: 42px;
      font-weight: 900;
      line-height: 1.1;
    }
    .give .stat { color: var(--teal); }
    .receive .stat { color: var(--red); }
    .stat-label { margin-right: 8px; font-size: 21px; }
    .count {
      margin-top: 5px;
      color: var(--ink-45);
      font-size: 18px;
      line-height: 1.3;
    }
    .summary {
      margin: 18px 0 0;
      color: var(--ink-70);
      font-size: 20px;
      font-weight: 400;
      line-height: 1.55;
    }
    .connection {
      position: absolute;
      z-index: 4;
      top: 314px;
      left: 522px;
      width: 156px;
      height: 270px;
      pointer-events: none;
    }
    .connection::before {
      content: '';
      position: absolute;
      top: 30px;
      bottom: 56px;
      left: 77px;
      border-left: 2px dotted rgba(251,191,36,0.75);
    }
    .arrow {
      position: absolute;
      width: 58px;
      height: 20px;
    }
    .arrow::before {
      content: '';
      position: absolute;
      top: 9px;
      width: 48px;
      border-top: 3px solid;
    }
    .arrow::after {
      content: '';
      position: absolute;
      top: 3px;
      width: 14px;
      height: 14px;
      border-top: 3px solid;
      border-right: 3px solid;
      transform: rotate(45deg);
    }
    .arrow-right { top: 0; left: 0; color: var(--teal); }
    .arrow-right::before { left: 0; }
    .arrow-right::after { right: 0; }
    .arrow-left { top: 0; right: 0; color: var(--red); }
    .arrow-left::before { right: 0; }
    .arrow-left::after { left: 0; transform: rotate(225deg); }
    .break {
      position: absolute;
      top: 48px;
      left: 4px;
      width: 148px;
      color: var(--amber);
      font-size: 18px;
      font-weight: 700;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="canvas" aria-label="部活動の地域移行における負担の受け渡し">
    <h1>渡す側と受け取る側</h1>
    <div class="panels">
      <section class="panel give" aria-label="負担を手放す側・教員の働き方">
        <img class="photo" src="../photos/teacher-staffroom.png" alt="職員室で考える学校教員">
        <div class="photo-shade" aria-hidden="true"></div>
        <div class="panel-content">
          <p class="kicker">負担を手放す側</p>
          <h2>教員の働き方</h2>
          <div class="stat"><span class="stat-label">支持</span>59.9%</div>
          <div class="count">227件の投稿</div>
          <p class="summary">「学校の中だけでは、もう支えきれない」</p>
        </div>
      </section>
      <section class="panel receive" aria-label="負担を受け取る側・費用と家庭負担">
        <img class="photo" src="../photos/parent-car.png" alt="車内で考える保護者">
        <div class="photo-shade" aria-hidden="true"></div>
        <div class="panel-content">
          <p class="kicker">負担を受け取る側</p>
          <h2>費用・家庭負担</h2>
          <div class="stat"><span class="stat-label">支持</span>16.7%</div>
          <div class="count">72件の投稿</div>
          <p class="summary">「月額8000円、子ども3人で年28万8000円」</p>
        </div>
      </section>
    </div>
    <div class="connection" aria-label="まだ受け渡しが成立していない">
      <div class="arrow arrow-right" aria-hidden="true"></div>
      <div class="arrow arrow-left" aria-hidden="true"></div>
      <div class="break">まだ受け渡しが<br>成立していない</div>
    </div>
  </main>
</body>
</html>
