<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=800,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root{--page:#07111E;--card-1:#0C1E35;--card-2:#0A1928;--card-3:#071522;--ink:#F0F4FF;--ink-70:rgba(240,244,255,.70);--ink-45:rgba(240,244,255,.45);--teal:#2DD4BF;--amber:#FBBF24}
    *{box-sizing:border-box}html,body,.canvas{width:800px;height:900px;margin:0;overflow:hidden}
    body{font-family:'Noto Sans JP',sans-serif;font-variant-numeric:tabular-nums;background:var(--page);color:var(--ink)}
    .canvas{position:relative;padding:32px 32px 0;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:radial-gradient(circle at 88% 8%,rgba(45,212,191,.12),transparent 30%),repeating-linear-gradient(0deg,transparent 0 47px,rgba(255,255,255,.025) 47px 48px),repeating-linear-gradient(90deg,transparent 0 47px,rgba(255,255,255,.025) 47px 48px),linear-gradient(145deg,var(--card-1) 0%,var(--card-2) 60%,var(--card-3) 100%)}
    h1{margin:0;font-size:42px;line-height:1.25;font-weight:700;letter-spacing:-.04em}
    .lead{margin:12px 0 34px;font-size:25px;line-height:1.32;color:var(--ink-70)}
    .block{margin-bottom:34px}
    .blockhead{font-size:26px;font-weight:500;color:var(--ink-70);margin-bottom:18px;letter-spacing:-.03em}
    .row{position:relative;height:78px;margin-bottom:14px}.row:last-child{margin-bottom:0}
    .name{position:absolute;left:0;top:20px;width:118px;font-size:28px;font-weight:700;letter-spacing:-.03em}
    .bar{position:absolute;left:130px;top:16px;width:430px;height:46px;background:rgba(255,255,255,.06)}
    .fill{height:46px;border-radius:0 4px 4px 0}
    .teal{background:var(--teal)}.amber{background:var(--amber)}
    .pct{position:absolute;left:576px;top:8px;font-size:44px;font-weight:900;letter-spacing:-.04em;line-height:1.1;white-space:nowrap}
    .sub{position:absolute;left:576px;top:56px;font-size:20px;color:var(--ink-45);white-space:nowrap}
    .t .pct{color:var(--teal)}.a .pct{color:var(--amber)}
    .foot{position:absolute;left:32px;bottom:26px;width:600px;font-size:21px;line-height:1.3;color:var(--ink-45);letter-spacing:-.03em}
    .credit{position:absolute;right:28px;bottom:28px;font-size:21px;color:var(--ink-45);letter-spacing:.08em}
  </style>
</head>
<body>
  <main class="canvas" aria-label="休日と平日で異なる地域展開の進み方">
    <h1>「地域展開します」は、平日が動くとは限らない</h1>
    <p class="lead">令和9年度（2027年度）の予定として、全国の自治体が答えた割合（うすい帯の全体が100%）</p>
    <div class="block">
      <div class="blockhead">地域展開に取り組む市区町村</div>
      <div class="row t"><div class="name">休日</div><div class="bar"><div class="fill teal" style="width:329px"></div></div><div class="pct">76.6%</div><div class="sub">1,333自治体</div></div>
      <div class="row a"><div class="name">平日</div><div class="bar"><div class="fill amber" style="width:200px"></div></div><div class="pct">46.6%</div><div class="sub">812自治体</div></div>
    </div>
    <div class="block">
      <div class="blockhead">地域展開した部活動</div>
      <div class="row t"><div class="name">休日</div><div class="bar"><div class="fill teal" style="width:164px"></div></div><div class="pct">38.2%</div><div class="sub">48,909部</div></div>
      <div class="row a"><div class="name">平日</div><div class="bar"><div class="fill amber" style="width:61px"></div></div><div class="pct">14.3%</div><div class="sub">18,261部</div></div>
    </div>
    <div class="foot">※スポーツ庁・文化庁「部活動改革の取組状況に関する調査」（令和8年度）。調査期間2026年4月22日〜5月22日。<br>部活動数の母数は128,000部。令和9年度の数値は予定で、実績ではありません</div>
    <div class="credit">SNS反応まっぷ</div>
  </main>
</body>
</html>
