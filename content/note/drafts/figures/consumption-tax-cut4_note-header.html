<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>note見出し画像 消費税減税シリーズ 第4回</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  /* 型は content/note/drafts/consumption-tax-cut-header-template.md（第1回で確立、色は4回とも固定） */
  html,body{margin:0;padding:0;width:1920px;height:1006px;overflow:hidden;}
  .canvas{position:relative;width:1920px;height:1006px;background:#faf7f1;font-family:'Noto Sans JP',sans-serif;}
  .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;}
  .scrim{position:absolute;inset:0;background:linear-gradient(90deg,
    rgba(250,247,241,0.98) 0%, rgba(250,247,241,0.96) 44%,
    rgba(250,247,241,0.62) 60%, rgba(250,247,241,0.10) 75%, rgba(250,247,241,0) 88%);}
  .text{position:absolute;left:100px;top:0;bottom:0;width:1150px;display:flex;flex-direction:column;justify-content:center;}
  .eyebrow{font-size:34px;font-weight:700;letter-spacing:.08em;color:#6b5d44;margin-bottom:20px;}
  .stat{font-weight:900;font-size:190px;line-height:1.05;white-space:nowrap;letter-spacing:-.02em;}
  .stat .n1{color:#1f5c4d;}
  .stat .arrow{color:#9c8d6c;font-size:115px;margin:0 8px;font-weight:700;}
  .stat .n2{color:#9c3c1a;}
  /* 第4回は、2つの数字（SNSの賛成と世論調査の賛成）を並べる型。矢印の型から外れる（オーナーが決める） */
  .pair .row{display:flex;align-items:baseline;gap:26px;line-height:1.08;white-space:nowrap;}
  .pair .lab{font-size:84px;font-weight:700;color:#6b5d44;min-width:230px;letter-spacing:.02em;}
  .pair .num{font-weight:900;font-size:190px;letter-spacing:-.02em;}
  .pair .n1{color:#1f5c4d;}
  .pair .n2{color:#9c3c1a;}
  .brand{position:absolute;right:44px;bottom:36px;font-size:24px;font-weight:700;letter-spacing:.06em;color:#5c5340;}
</style>
</head>
<body>
  <div class="canvas">
    <img class="photo" src="../photos/consumption-tax-cut4-two-gauges.png" alt="">
    <div class="scrim"></div>
    <div class="text">
      <div class="eyebrow">消費税減税シリーズ　第4回</div>
      <div class="pair"><div class="row"><span class="lab">SNS</span><span class="num n1">4割</span></div><div class="row"><span class="lab">世論</span><span class="num n2">5割</span></div></div>
    </div>
    <div class="brand">SNS反応まっぷ</div>
  </div>
</body>
</html>
